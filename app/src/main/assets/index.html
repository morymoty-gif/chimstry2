  VIEWS.home = () => {
    const rec = S.recent && libById(S.recent), fc = dayFact();
    const hero = '<div class="herofact"><svg class="hf-art" viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"><ellipse cx="60" cy="60" rx="52" ry="20"/><ellipse cx="60" cy="60" rx="52" ry="20" transform="rotate(60 60 60)"/><ellipse cx="60" cy="60" rx="52" ry="20" transform="rotate(120 60 60)"/></g><circle cx="60" cy="60" r="8" fill="#FFD27A"/><circle cx="112" cy="60" r="4.5" fill="#fff"/><circle cx="34" cy="105" r="4.5" fill="#fff"/><circle cx="34" cy="15" r="4.5" fill="#fff"/></svg><div class="hf-tx"><span class="hf-tag">حقیقت شیمی امروز</span><h2>' + fc[1] + '</h2><p>' + fc[2] + '</p><div class="row"><button class="hf-btn" data-act="factnext">حقیقت بعدی</button><button class="hf-btn ghost" data-act="module" data-id="facts">همه‌ی حقیقت‌ها</button></div></div></div>';
    const card = (id, title, sub, g, art, act, cnt) => '<button class="cat2" style="--g1:' + g[0] + ';--g2:' + g[1] + '" data-act="' + act[0] + '" data-id="' + act[1] + '"><span class="art">' + art + '</span><b>' + title + '</b><span class="s">' + sub + '</span><i class="cnt">' + cnt + '</i></button>';
    const grid = card('lewis', 'ساختار لوویس', 'رسم، تمرین و راهنما', G.lewis, ART.lewis, ['hub', 'lewis'], fa(5) + ' بخش') +
      card('pol', 'قطبی و ناقطبی', 'ممان دوقطبی و میدان الکتریکی', G.pol, ART.pol, ['module', 'pol'], fa(PE.MOLS.length) + ' مولکول') +
      card('balance', 'موازنه‌ی واکنش‌ها', 'روش وارسی', G.balance, ART.balance, ['module', 'balance'], fa(BE.LIBR.length) + ' واکنش') +
      card('basics', 'فرمول، نام و یون', 'جرم مولی، اکسیدها، جدول بازی', G.basics, ART.basics, ['hub', 'basics'], fa(6) + ' بخش') +
      card('cfg', 'آرایش الکترونی', 'عنصرها، یون‌ها، قاعده‌ها', G.cfg, ART.cfg, ['module', 'cfg'], fa(54) + ' عنصر') +
      card('acid', 'اسید، باز و pH', 'اسیدهای مهم و محاسبه‌ی pH', G.acid, ART.acid, ['module', 'acid'], fa(SE.ACIDS.length) + ' ماده') +
      card('ech', 'الکتروشیمی', 'سلول گالوانی و جدول E°', G.ech, ART.ech, ['module', 'ech'], fa(SE.COUPLES.length) + ' نیم‌واکنش') +
      card('fun', 'بازی و کاربرد', 'بازی، حقیقت‌های جذاب، شیمی در زندگی', G.fun, ART.fun, ['hub', 'fun'], fa(5) + ' بخش') +
      card('quizzes', 'آزمون‌ها', 'برای هر بخش یک آزمون', G.quizzes, ART.quizzes, ['nav', 'quizzes'], fa(QUIZ_LIST.length) + ' آزمون');
    return {
      title: 'ساختار لوویس', subtitle: 'یار شیمی دبیرستان', root: true,
      html: hero + (rec ? '<button class="resume" data-act="open" data-id="' + rec.id + '"><span>ادامه‌ی یادگیری</span><b>' + E.formulaHTML(rec.f, rec.c) + ' · ' + rec.fa + '</b></button>' : '') + '<div class="cats2">' + grid + '</div>' +
        creditCard()
    };
  };

  const HUB_QUIZ = { mm: 'mm', fw: 'fw', nm: 'nm', ox: 'ox', ion: 'ion', game: 'game' };
  VIEWS.hub = () => {
    const h = HUBS.find((x) => x.id === (S.route.params || {}).id) || HUBS[0];
    const rows = h.items.map((id) => {
      const m = modInfo(id);
      const q = HUB_QUIZ[id] ? '<button class="hquiz" data-act="hubquiz" data-id="' + id + '" aria-label="آزمون ' + m.title + '">آزمون</button>' : '';
      return '<div class="hrow"><button class="hmain" data-act="module" data-id="' + id + '">' + modBadge(m, h.g) + '<span class="ht"><b>' + m.title + '</b><span>' + m.sub + '</span></span></button>' + q + '</div>';
    }).join('');
    return { title: h.title, subtitle: h.sub.length < 36 ? h.sub : '', back: true, html: '<div class="hubhead" style="--g1:' + h.g[0] + ';--g2:' + h.g[1] + '"><span class="art">' + ART[h.id] + '</span></div><div class="hlist">' + rows + '</div>' };
  };

  VIEWS.quizzes = () => ({
    title: 'آزمون‌ها', subtitle: 'برای هر بخش یک آزمون', back: true,
    html: '<div class="hlist">' + QUIZ_LIST.map((q) => {
      const g = G[q[4]] || G.basics, best = q[3]();
      return '<div class="hrow"><button class="hmain" data-act="qgo" data-id="' + q[0] + '"><span class="mbadge" style="--g1:' + g[0] + ';--g2:' + g[1] + '">' + lineIcon('quiz') + '</span><span class="ht"><b>' + q[1] + '</b><span>' + q[2] + '</span></span></button><span class="best num">' + (best ? fa(best) + '/۱۰' : '—') + '</span></div>';
    }).join('') + '</div>'
  });

  // balance gets tool/quiz tabs
  const _balView = VIEWS.balance;
  VIEWS.balance = () => {
    const v = _balView();
    v.html = csTabs('bal', [['tool', 'موازنه'], ['quiz', 'آزمون']]) + (S.cs.bal.tab === 'quiz' ? cqHTML('bal') : v.html);
    v.back = true; return v;
  };
  const _quizView = VIEWS.quiz;
  VIEWS.quiz = () => { const v = _quizView(); v.back = true; return v; };
  ['mm', 'fw', 'nm', 'ox', 'ion', 'game', 'cfg', 'acid', 'ech', 'pol', 'poldet', 'gmem', 'gpol', 'gsym', 'facts', 'apps', 'hub', 'balance', 'bal', 'about', 'guide', 'detail'].forEach((k) => { NAV_OF[k] = 'home'; });
  NAV_OF.quizzes = 'quizzes'; NAV_OF.quiz = 'quizzes';

  /* ---------- dispatch ---------- */
  function EXTRA_CLICK(act, id, el) {
    switch (act) {
      case 'hub': go('hub', { id }); return true;
      case 'hubquiz': S.cs[id].tab = 'quiz'; go(id); return true;
      case 'qgo': {
        if (id === 'lewis') go('quiz');
        else if (id === 'bal') { S.cs.bal.tab = 'quiz'; go('balance'); }
        else { S.cs[id].tab = 'quiz'; go(id); }
        return true;
      }
      case 'module': { if (id === 'balance' && S.cs.bal.tab === 'quiz') S.cs.bal.tab = 'tool'; break; }
      default: break;
    }
    return POL_CLICK(act, id, el) || FUN_CLICK(act, id, el) || SCI_CLICK(act, id, el) || false;
  }
  function EXTRA_INPUT(t) {
    if (t.id === 'pol-q') { S.cs.pol.q = t.value; const o = $('#cs-out'); if (o) o.innerHTML = polList(); return true; }
    return SCI_INPUT(t);
  }


  function render(scrollTop) {
    const r = S.route, v = VIEWS[r.name]();
    const root = $('#app');
    const left = (v.back || r.name !== 'home')
      ? '<button class="icon-btn" data-act="back" aria-label="بازگشت">' + icon('back') + '</button>'
      : (v.root ? '<div class="logo"><svg viewBox="0 0 24 24">' + IC.logo + '</svg></div>' : '');
    root.innerHTML = '<header class="topbar">' + left + '<h1>' + v.title + (v.subtitle ? '<span class="sub">' + v.subtitle + '</span>' : '') + '</h1>' +
      '<button class="icon-btn" data-act="settings" aria-label="تنظیمات">' + icon('gear') + '</button></header>' +
      '<main>' + v.html + '</main>' +
      '<nav class="nav" aria-label="پیمایش اصلی"><div class="nav-in">' + NAVS.map((n) =>
        '<button data-act="nav" data-id="' + n[0] + '"' + (NAV_OF[r.name] === n[0] ? ' aria-current="page"' : '') + '>' + icon(n[2]) + n[1] + '</button>').join('') + '</div></nav>' +
      (S.sheet ? sheetHTML() : '');
    if (scrollTop) window.scrollTo(0, 0);
    document.title = 'ساختار لوویس';
  }

  function sheetHTML() {
    const seg = (key, opts) => '<div class="seg" role="group">' + opts.map((o) => '<button data-act="set" data-key="' + key + '" data-val="' + o[0] + '" aria-pressed="' + (String(S.set[key]) === String(o[0])) + '">' + o[1] + '</button>').join('') + '</div>';
    return '<div class="sheet-bg" data-act="closeSheet"><div class="sheet" role="dialog" aria-label="تنظیمات" data-stop="1"><h2>تنظیمات</h2>' +
      '<div class="field"><label>نمایش جفت الکترون ناپیوندی</label>' + seg('pairs', [['dots', 'نقطه ••'], ['lines', 'خط —']]) + '</div>' +
      '<div class="field"><label>قاعده‌ی رسم</label>' + seg('mode', [['min', 'کمینه‌ی بار رسمی'], ['octet', 'هشتایی سخت‌گیرانه']]) + '</div>' +
      '<div class="field"><label>نمایش بار رسمی</label>' + seg('fc', [[true, 'روشن'], [false, 'خاموش']]) + '</div>' +
      '<div class="field"><label>پوسته</label>' + seg('theme', [['auto', 'خودکار'], ['light', 'روشن'], ['dark', 'تاریک']]) + '</div>' +
      '<div class="row nowrap"><button class="btn grow" data-act="goAbout">درباره‌ی اپ</button><button class="btn primary grow" data-act="closeSheet" data-close="1">بستن</button></div>' +
      creditCard('mini') + '</div></div>';
  }

  /* ---------- events ---------- */
  document.addEventListener('click', (ev) => {
    // interactive drawing
    const hit = ev.target.closest && ev.target.closest('.hit');
    if (hit && S.pr && $('#pr-canvas') && $('#pr-canvas').contains(hit)) {
      const p = S.pr;
      if (hit.dataset.atom != null) { const i = +hit.dataset.atom; p.st.lp[i] = (p.st.lp[i] + 1) % 5; }
      else if (hit.dataset.bond != null) { const i = +hit.dataset.bond; p.st.order[i] = (p.st.order[i] % 3) + 1; }
      p.checked = false; p.msg = null; p.solved = false;
      refreshPractice();
      return;
    }
    const el = ev.target.closest && ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (act === 'closeSheet') {
      if (el.dataset.close || ev.target === el) { S.sheet = null; render(); }
      return;
    }
    if (EXTRA_CLICK(act, id, el) || CHEM_CLICK(act, id, el)) return;
    switch (act) {
      case 'nav': S.sheet = null; S.hist = []; S.route = { name: 'home' }; if (id === 'home') render(true); else go(id); break;
      case 'module': { const m = MODULES.find((x) => x.id === id); m.go(); break; }
      case 'back': goBack(); break;
      case 'open': { const lib = libById(id); openCmp(cmpOf(lib), el.dataset.tab); break; }
      case 'openCustom': { const st = solverState(); if (st.cmp) openCmp(st.cmp, 'steps'); break; }
      case 'cat': S.lib.cat = id; render(); break;
      case 'fav': {
        const k = S.favs.indexOf(id); if (k >= 0) S.favs.splice(k, 1); else S.favs.push(id);
        store.set('favs', S.favs);
        if (S.route.name === 'library') { $('#lib-list').innerHTML = libCards(); } else render();
        break;
      }
      case 'tab': S.cur.tab = id; if (id === 'steps') S.cur.step = 0; render(); window.scrollTo(0, 0); break;
      case 'step': S.cur.step = Math.max(0, +id); render(); break;
      case 'mode': S.set.mode = id; saveSettings(); if (S.pr) { S.pr = null; } render(); break;
      case 'practiceThis': { S.pr = startPractice(S.cur.cmp); go('practice'); break; }
      case 'charge': S.solver.charge = +id; S.solver.fromText = false; $('#sv-out').innerHTML = solverPreview(); $$('#sv-ch .chip').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.id === S.solver.charge))); break;
      case 'central': S.solver.central = id || null; $('#sv-out').innerHTML = solverPreview(); break;
      case 'example': {
        const pi = E.parseInput(id);
        S.solver.text = id; S.solver.charge = pi.charge == null ? 0 : pi.charge; S.solver.fromText = pi.charge != null; S.solver.central = null;
        render(); break;
      }
      case 'pcheck': practiceCheck(); refreshPractice(); break;
      case 'phint': practiceHint(); refreshPractice(); break;
      case 'preset': S.pr = startPractice(S.pr.cmp); refreshPractice(); break;
      case 'panswer': {
        const p = S.pr; const sol = p.sol; p.st = E.cloneState(sol.final); p.checked = true; p.msg = { k: 'info', t: 'این پاسخ است. در «گام‌به‌گام» می‌توانی ببینی چطور به آن می‌رسیم.' }; refreshPractice(); break;
      }
      case 'pnext': S.pr = startPractice(cmpOf(randomLib(S.pr.cmp.id))); render(true); break;
      case 'qstart': S.quiz = { qs: Array.from({ length: 10 }, makeQuestion), i: 0, score: 0, answered: null, done: false }; render(true); break;
      case 'qans': {
        const z = S.quiz; if (z.answered != null) break; z.answered = +id;
        if (z.qs[z.i].opts[+id] === z.qs[z.i].ans) z.score++;
        render(); break;
      }
      case 'qnext': {
        const z = S.quiz;
        if (z.i === 9) { z.done = true; if (z.score > S.stats.quizBest) { S.stats.quizBest = z.score; store.set('stats', S.stats); } }
        else { z.i++; z.answered = null; }
        render(true); break;
      }
      case 'settings': S.sheet = true; render(); break;
      case 'set': {
        const k = el.dataset.key; let v = el.dataset.val;
        if (v === 'true') v = true; else if (v === 'false') v = false;
        S.set[k] = v; saveSettings(); if (k === 'theme') applyTheme();
        if (k === 'mode') S.pr = null;
        render(); break;
      }
      case 'balOpen': if (id) openBal(id); else { const r = balRes(S.balIn); if (r.ok) openBal(null, S.balIn, 'معادله‌ی شما'); } break;
      case 'balTab': S.bal.tab = id; if (id === 'steps') S.bal.step = 0; render(); window.scrollTo(0, 0); break;
      case 'balStep': S.bal.step = Math.max(0, +id); render(); break;
      case 'balCat': S.balUI.cat = id; render(); break;
      case 'balIns': { const inp = $('#bl-in'); if (id === '') S.balIn = ''; else S.balIn += id; render(); const n = $('#bl-in'); if (n) { n.focus(); } break; }
      case 'balCheck': balCheck(); { const m = $('#bl-msg'); m.innerHTML = '<div class="msg ' + S.bal.pr.msg.k + '" role="status">' + S.bal.pr.msg.t + '</div>'; if (S.bal.pr.msg.k === 'ok') toast('✓ درست بود'); } break;
      case 'balHint': balHint(); { const m = $('#bl-msg'); m.innerHTML = '<div class="msg ' + S.bal.pr.msg.k + '" role="status">' + S.bal.pr.msg.t + '</div>'; } break;
      case 'balClear': S.bal.pr = { vals: [], msg: null, hint: 0 }; render(); break;
      case 'balAnswer': { const res = balRes(S.bal.eq); S.bal.pr.vals = res.ints.map(String); S.bal.pr.msg = { k: 'info', t: 'این پاسخ است. در «وارسی گام‌به‌گام» ببین چطور به آن می‌رسیم.' }; render(); break; }
      case 'balNext': { const pool = BE.LIBR.filter((r) => r.id !== S.bal.id); const r = pool[Math.floor(Math.random() * pool.length)]; openBal(r.id); S.bal.tab = 'practice'; render(true); break; }
      case 'balCopy': {
        const res = balRes(S.bal.eq);
        const side = (list, off) => list.map((sp, k) => { const c = res.ints[off + k]; return (c === 1 ? '' : c + ' ') + sp.f + (sp.state ? '(' + sp.state + ')' : ''); }).join(' + ');
        const txt = side(res.eq.reactants, 0) + ' → ' + side(res.eq.products, res.nR);
        try { navigator.clipboard.writeText(txt).then(() => toast('کپی شد'), () => toast(txt)); } catch (e) { toast(txt); }
        break;
      }
      case 'goAbout': S.sheet = null; go('about'); break;
      default: break;
    }
  });

  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (EXTRA_INPUT(t) || CHEM_INPUT(t)) return;
    if (t.id === 'lib-q') { S.lib.q = t.value; $('#lib-list').innerHTML = libCards(); }
    else if (t.id === 'bl-in') { S.balIn = t.value; $('#bl-out').innerHTML = balPreview(); }
    else if (t.id === 'bl-q') { S.balUI.q = t.value; $('#bl-list').innerHTML = balListHTML(); }
    else if (t.classList && t.classList.contains('co-in')) { t.value = t.value.replace(/[^0-9۰-۹]/g, '').replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); S.bal.pr.vals[+t.dataset.j] = t.value; refreshPrLive(); }
    else if (t.id === 'sv-in') {
      S.solver.text = t.value; S.solver.central = null;
      const pi = E.parseInput(t.value);
      if (pi.toks && pi.charge != null) { S.solver.charge = pi.charge; S.solver.fromText = true; }
      else if (S.solver.fromText) { S.solver.charge = 0; S.solver.fromText = false; }
      $$('#sv-ch .chip').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.id === S.solver.charge)));
      $('#sv-out').innerHTML = solverPreview();
    }
  });
  document.addEventListener('change', (ev) => {
    if (CHEM_CHANGE(ev.target) || SCI_CHANGE(ev.target)) return;
    if (ev.target.id === 'pr-sel') {
      const lib = libById(ev.target.value);
      S.pr = startPractice(cmpOf(lib)); render(true);
    }
  });

  applyTheme();
  render();
})();

</script>
</body></html>

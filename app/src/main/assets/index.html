/* Layout concept: single-column phone app, sticky top bar, fixed bottom tab bar, drawing canvas as the hero of every screen.
   Identity: cobalt ink + amber electron pairs (the lone-pair color is the brand accent). */
:root {
  --bg: #EDF1F8;
  --surface: #FFFFFF;
  --surface-2: #F5F7FC;
  --ink: #0F1A38;
  --muted: #56648A;
  --line: #D6DDEE;
  --brand: #2B3FD4;
  --brand-ink: #FFFFFF;
  --tint: #E1E7FB;
  --electron: #D97F00;
  --electron-soft: #FCEFD7;
  --pos: #C62F2A;
  --neg: #1767C9;
  --ok: #138A4B;
  --ok-soft: #DDF3E7;
  --warn: #B25E00;
  --warn-soft: #FDEBD3;
  --shadow: 0 1px 2px rgba(15, 26, 56, .06), 0 6px 18px rgba(15, 26, 56, .06);
  --r-lg: 18px;
  --r-md: 12px;
  --r-sm: 8px;
  --font: 'Vazirmatn', Tahoma, 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1124; --surface: #141C38; --surface-2: #1A2345; --ink: #E9EDFA; --muted: #97A4C9;
    --line: #27325E; --brand: #8796FF; --brand-ink: #0B1124; --tint: #1F2A57;
    --electron: #FFB93B; --electron-soft: #3A2D12; --pos: #FF7C74; --neg: #6DB5FF;
    --ok: #4CD08A; --ok-soft: #12352A; --warn: #FFB04A; --warn-soft: #3B2A10;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1124; --surface: #141C38; --surface-2: #1A2345; --ink: #E9EDFA; --muted: #97A4C9;
  --line: #27325E; --brand: #8796FF; --brand-ink: #0B1124; --tint: #1F2A57;
  --electron: #FFB93B; --electron-soft: #3A2D12; --pos: #FF7C74; --neg: #6DB5FF;
  --ok: #4CD08A; --ok-soft: #12352A; --warn: #FFB04A; --warn-soft: #3B2A10;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.75;
  direction: rtl;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; color: inherit; }
a { color: var(--brand); }
h1, h2, h3 { margin: 0; line-height: 1.4; text-wrap: balance; }
p { margin: 0 0 .6em; }
sub, sup { line-height: 0; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.formula { unicode-bidi: isolate; direction: ltr; display: inline-block; font-weight: 700; letter-spacing: .01em; }
.formula sub { font-size: .66em; vertical-align: -.22em; }
.formula sup { font-size: .66em; vertical-align: .5em; }
.sym { font-weight: 800; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg);
  display: flex; align-items: center; gap: 10px; padding: 10px 0 8px;
}
.topbar h1 { font-size: 19px; font-weight: 800; flex: 1; min-width: 0; }
.topbar .sub { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.icon-btn {
  width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; flex: none;
}
.icon-btn svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.logo {
  width: 42px; height: 42px; border-radius: 12px; background: var(--brand); color: var(--brand-ink);
  display: grid; place-items: center; flex: none;
}
.logo svg { width: 28px; height: 28px; }

main { flex: 1; padding: 6px 0 calc(92px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }

/* ---------- bottom nav ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(10px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.nav button {
  background: none; border: 0; padding: 6px 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 11.5px; font-weight: 600; color: var(--muted); border-radius: 12px; min-height: 52px;
}
.nav button svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--brand); background: var(--tint); }

/* ---------- cards & buttons ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card h2 { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
.card h3 { font-size: 14.5px; font-weight: 700; margin-bottom: 4px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 16px; font-weight: 700;
  min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.block { width: 100%; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.nowrap { flex-wrap: nowrap; }
.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600;
  min-height: 34px; display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"], .chip.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.fact { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; display: flex; flex-direction: column; min-width: 0; }
.fact b { font-size: 15px; font-variant-numeric: tabular-nums; text-align: right; display: block; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px 6px; font-size: 13.5px; font-weight: 700; color: var(--muted); min-height: 40px; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); }

/* ---------- home ---------- */
.hero { background: var(--brand); color: var(--brand-ink); border-radius: var(--r-lg); padding: 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.hero h2 { font-size: 17px; font-weight: 800; }
.hero p { margin: 2px 0 0; font-size: 13px; opacity: .9; }
.hero .btn { background: var(--brand-ink); color: var(--brand); border-color: transparent; flex: none; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  text-align: right; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px;
  display: flex; flex-direction: column; gap: 8px; min-height: 148px; box-shadow: var(--shadow); position: relative; min-width: 0;
}
.tile .ic { height: 62px; border-radius: 12px; background: var(--tint); display: grid; place-items: center; color: var(--brand); overflow: hidden; }
.tile .ic svg.line-ic { width: 34px; height: 34px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tile b { font-size: 15px; font-weight: 800; line-height: 1.4; }
.tile span.s { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.tile.soon { border-style: dashed; box-shadow: none; opacity: .85; }
.badge { position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 700; background: var(--electron-soft); color: var(--warn); padding: 1px 8px; border-radius: 999px; }
.credit { text-align: center; font-size: 13px; color: var(--muted); padding: 6px 0 0; }
.credit b { color: var(--ink); }

/* ---------- library ---------- */
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 12px; min-height: 48px; }
.search input { border: 0; background: none; outline: none; flex: 1; min-width: 0; font-size: 16px; padding: 8px 0; }
.search svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 4px; text-align: center; min-width: 0; position: relative;
}
.cmp .pic { height: 88px; display: grid; place-items: center; background: var(--surface-2); border-radius: 10px; overflow: hidden; }
.cmp .f { font-size: 17px; }
.cmp .n { font-size: 12.5px; color: var(--muted); line-height: 1.4; overflow-wrap: anywhere; }
.star { position: absolute; top: 12px; right: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; padding: 0; }
.star svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }
.star.on svg { fill: var(--electron); stroke: var(--electron); }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }

/* ---------- drawing ---------- */
svg.lewis { display: block; margin: 0 auto; direction: ltr; max-width: 100%; height: auto; overflow: visible; }
.lewis .bond { stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; }
.lewis .lp-dot { fill: var(--electron); }
.lewis .lp-line { stroke: var(--electron); stroke-width: 2.8; stroke-linecap: round; }
.lewis text.atom { fill: var(--ink); font-weight: 800; font-family: var(--font); text-anchor: middle; }
.lewis .hl { fill: var(--tint); }
.lewis .fc-ring { fill: var(--surface); stroke-width: 1.6; }
.lewis .fc-ring.pos, .lewis text.fc.pos { stroke: var(--pos); }
.lewis .fc-ring.neg, .lewis text.fc.neg { stroke: var(--neg); }
.lewis text.fc { font-weight: 800; text-anchor: middle; font-family: var(--font); stroke: none; }
.lewis text.fc.pos { fill: var(--pos); } .lewis text.fc.neg { fill: var(--neg); }
.lewis .brk { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.lewis text.chg { fill: var(--ink); font-weight: 800; font-family: var(--font); }
.lewis .hit { fill: transparent; stroke: transparent; cursor: pointer; }
.lewis .hit:hover { fill: rgba(43, 63, 212, .08); }
.lewis .bad { fill: none; stroke: var(--pos); stroke-width: 2; stroke-dasharray: 4 3; }
.lewis .good { fill: none; stroke: var(--ok); stroke-width: 2; }
.canvas { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 8px; box-shadow: var(--shadow); }
.canvas.dots-bg { background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 18px 18px; background-color: var(--surface); }
.reso { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; }
.reso .arrow { font-size: 22px; color: var(--muted); flex: none; }
.reso .rs { flex: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px; }

/* ---------- detail ---------- */
.head-card { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.head-card .big { font-size: 30px; line-height: 1.2; }
.head-card .names { min-width: 0; }
.head-card .en { direction: ltr; text-align: right; font-size: 12.5px; color: var(--muted); }
.tabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 15; background: var(--bg); padding: 4px 0 8px; margin-bottom: -6px; }
.note { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; border: 1px solid var(--line); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
td.pos, b.pos { color: var(--pos); } td.neg, b.neg { color: var(--neg); }
.mini-table { margin: 6px 0 10px; }
.mini-table td { text-align: right; padding: 4px 6px; } .mini-table td.num { text-align: left; direction: ltr; }
.mini-table tr.total td { font-weight: 800; border-top: 2px solid var(--ink); border-bottom: 0; }

/* stepper */
.progress { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--electron); border-radius: 999px; transition: width .35s ease; }
.dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.dots button { width: 12px; height: 12px; padding: 0; border-radius: 50%; border: 0; background: var(--line); }
.dots button[aria-current="step"] { background: var(--brand); transform: scale(1.35); }
.dots button.done { background: var(--electron); }
.step-body p { margin-bottom: .5em; }
.formula-note { background: var(--tint); border-radius: 10px; padding: 6px 10px; font-size: 13.5px; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checks li { padding: 8px 10px 8px 10px; border-radius: 10px; font-size: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.checks li.ok { background: var(--ok-soft); border-color: transparent; }
.checks li.warn { background: var(--warn-soft); border-color: transparent; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; }
.text-in { width: 100%; direction: ltr; text-align: left; font-size: 22px; font-weight: 700; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); letter-spacing: .02em; min-height: 56px; }
.text-in:focus { border-color: var(--brand); outline: none; }
.msg { border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.msg.err { background: var(--warn-soft); color: var(--warn); }
.msg.ok { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.msg.info { background: var(--tint); }
.counter { display: flex; align-items: center; gap: 10px; }
.counter .progress { flex: 1; }

/* quiz */
.opts { display: grid; gap: 8px; }
.opt { text-align: right; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; font-weight: 700; min-height: 52px; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--pos); }
.opt:disabled { opacity: 1; cursor: default; }
.score { font-size: 44px; font-weight: 800; text-align: center; color: var(--brand); }

/* sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 28, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 88%; overflow: auto; }
.sheet h2 { font-size: 17px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 60; max-width: 90%; text-align: center; }

.guide-step { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.guide-step .no { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 800; }
.guide-list { margin: 0; padding: 0 18px 0 0; }
.guide-list li { margin-bottom: 4px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (min-width: 640px) { .tiles { gap: 14px; } }

/* ---------- balance ---------- */
.eq { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 6px; font-size: 20px; line-height: 1.4; direction: ltr; }
.eq.sm { font-size: 14.5px; justify-content: flex-start; gap: 4px 4px; }
.eq .plus, .eq .arrow { color: var(--muted); font-weight: 700; padding: 0 2px; }
.eq .arrow { color: var(--brand); font-size: 1.15em; }
.term { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 10px; white-space: nowrap; }
.eq.sm .term { padding: 0 2px; }
.term.hl { background: var(--tint); outline: 2px solid var(--brand); }
.term .formula { font-weight: 700; }
.co { color: var(--brand); font-weight: 800; }
.st { color: var(--muted); font-size: .6em; font-weight: 500; margin-left: 1px; }
.box { display: inline-block; width: 22px; height: 22px; border: 2px dashed var(--muted); border-radius: 6px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; font-size: .8em; }
.frac i { font-style: normal; padding: 0 3px; }
.frac i:first-child { border-bottom: 2px solid currentColor; }
.co-in { width: 46px; height: 44px; text-align: center; font-size: 19px; font-weight: 800; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--brand); padding: 0; font-variant-numeric: tabular-nums; }
.co-in:focus { border-color: var(--brand); outline: none; }
.text-in.sm { font-size: 17px; min-height: 52px; }
.rule-tag { background: var(--electron-soft); color: var(--warn); font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.rlist { display: flex; flex-direction: column; gap: 8px; }
.ritem { text-align: right; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; overflow-x: auto; }
.ritem .rt { font-weight: 700; font-size: 14.5px; }
.done-mark { color: var(--ok); font-style: normal; font-weight: 800; }
.muted-i { opacity: .7; font-variant-numeric: tabular-nums; }
table.atoms td, table.atoms th { padding: 4px 8px; }
table.atoms tr.eqbad td { color: var(--pos); font-weight: 700; }
table.atoms tr.eqok td:last-child { color: var(--ok); font-weight: 800; }
.ok-t { color: var(--ok); font-weight: 700; }

/* ===== chem stages ===== */
.sel { font: inherit; font-size: 15px; font-weight: 600; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); min-height: 48px; width: 100%; }
.sel:focus { border-color: var(--brand); outline: none; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; background: var(--tint); color: var(--brand); padding: 1px 9px; border-radius: 999px; }
.mm-list { display: flex; flex-direction: column; gap: 6px; }
.mm-row { display: grid; grid-template-columns: 1fr auto 64px; gap: 10px; align-items: center; text-align: right; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 48px; }
.mm-row.on { border-color: var(--brand); background: var(--tint); }
.mm-row .n { font-size: 13.5px; color: var(--muted); }
.mm-row .f { font-size: 16px; }
.mm-row .v { font-weight: 800; text-align: left; color: var(--brand); }
.ion-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; align-items: center; text-align: center; }
.ion-card .sy { font-size: 24px; min-height: 34px; display: flex; align-items: center; }
.ion-card b { font-size: 14px; }
.gt-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.gtable { width: auto; min-width: 100%; font-size: 13px; text-align: center; border-collapse: separate; border-spacing: 0; }
.gtable th, .gtable td { padding: 3px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.gtable thead th { background: var(--surface-2); font-size: 14px; padding: 8px 6px; position: sticky; top: 0; }
.gtable th[scope="row"], .gtable th.corner { position: sticky; right: 0; background: var(--surface-2); z-index: 2; padding: 6px 10px; border-left: 1px solid var(--line); font-size: 14px; }
.gtable th.corner { font-size: 11px; color: var(--muted); font-weight: 600; }
.gcell { min-width: 58px; min-height: 40px; border: 1px solid transparent; background: none; border-radius: 9px; font-size: 14px; padding: 4px 6px; }
.gcell.on { border-color: var(--brand); background: var(--tint); }
.gcell.slot { border: 2px dashed var(--line); color: var(--muted); min-width: 74px; min-height: 48px; }
.gcell.slot.filled { border-style: solid; border-color: var(--brand); color: var(--ink); background: var(--tint); }
.gcell.slot.good { border-color: var(--ok); background: var(--ok-soft); }
.gcell.slot.bad { border-color: var(--pos); background: var(--warn-soft); }
.gtable.play { width: 100%; }
.gchip { font-size: 16px; min-height: 44px; }
.btn[disabled] { opacity: .5; }

/* ===== home redesign / hubs ===== */
.cats { display: grid; gap: 12px; }
.cat { display: flex; align-items: center; gap: 14px; text-align: right; color: #fff; border: 0; border-radius: 24px; padding: 14px 16px; min-height: 108px; background: linear-gradient(135deg, var(--g1), var(--g2)); box-shadow: 0 8px 22px rgba(15, 26, 56, .16); position: relative; overflow: hidden; }
.cat::after { content: ""; position: absolute; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.1); left: -40px; top: -50px; }
.cat:active { transform: scale(.985); }
.cat .art { flex: none; width: 96px; height: 72px; position: relative; z-index: 1; }
.cat .art svg { width: 100%; height: 100%; }
.cat .tx { display: flex; flex-direction: column; gap: 3px; position: relative; z-index: 1; min-width: 0; }

<script>
/* ===== Lewis engine: pure logic, no DOM ===== */
(function (root) {
  'use strict';

  const EL = {
    H:  { v: 1, en: 2.20, p: 1, fa: 'هیدروژن' },
    Be: { v: 2, en: 1.57, p: 2, fa: 'برلیم' },
    B:  { v: 3, en: 2.04, p: 2, fa: 'بور' },
    C:  { v: 4, en: 2.55, p: 2, fa: 'کربن' },
    N:  { v: 5, en: 3.04, p: 2, fa: 'نیتروژن' },
    O:  { v: 6, en: 3.44, p: 2, fa: 'اکسیژن' },
    F:  { v: 7, en: 3.98, p: 2, fa: 'فلوئور' },
    Al: { v: 3, en: 1.61, p: 3, fa: 'آلومینیم' },
    Si: { v: 4, en: 1.90, p: 3, fa: 'سیلیسیم' },
    P:  { v: 5, en: 2.19, p: 3, fa: 'فسفر' },
    S:  { v: 6, en: 2.58, p: 3, fa: 'گوگرد' },
    Cl: { v: 7, en: 3.16, p: 3, fa: 'کلر' },
    Ge: { v: 4, en: 2.01, p: 4, fa: 'ژرمانیم' },
    As: { v: 5, en: 2.18, p: 4, fa: 'آرسنیک' },
    Se: { v: 6, en: 2.55, p: 4, fa: 'سلنیم' },
    Br: { v: 7, en: 2.96, p: 4, fa: 'برم' },
    Te: { v: 6, en: 2.10, p: 5, fa: 'تلوریم' },
    I:  { v: 7, en: 2.66, p: 5, fa: 'ید' },
    Xe: { v: 8, en: 2.60, p: 5, fa: 'زنون' }
  };
  const EL_KEYS = Object.keys(EL);
  const DEFICIENT = { H: 1, Be: 1, B: 1, Al: 1 }; // never forced to an octet by rule 2

  /* ---------- Persian digits ---------- */
  const FA = '۰۱۲۳۴۵۶۷۸۹';
  const fa = (x) => String(x).replace(/\d/g, (d) => FA[+d]).replace(/-/g, '−');
  const faSigned = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + fa(Math.abs(n));

  /* ---------- Input parsing ---------- */
  const SUPD = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  function normalize(s) {
    return s
      .replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
      .replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
      .replace(/[₀-₉]/g, (d) => String(d.charCodeAt(0) - 0x2080))
      .replace(/[−–—‒]/g, '-')
      .replace(/＋/g, '+');
  }
  function parseCharge(s) {
    let m = s.match(/([⁰¹²³⁴⁵⁶⁷⁸⁹]*)([⁺⁻])\s*$/);
    if (m) {
      const n = m[1] ? parseInt(m[1].split('').map((c) => SUPD.indexOf(c)).join(''), 10) : 1;
      return { charge: (m[2] === '⁺' ? 1 : -1) * n, rest: s.slice(0, m.index) };
    }
    s = normalize(s);
    const tries = [
      [/\^\s*\(?\s*(\d*)\s*([+-])\s*\)?\s*$/, (m) => (m[2] === '+' ? 1 : -1) * (m[1] ? +m[1] : 1)],
      [/\^\s*\(?\s*([+-])\s*(\d*)\s*\)?\s*$/, (m) => (m[1] === '+' ? 1 : -1) * (m[2] ? +m[2] : 1)],
      [/\(\s*(\d*)\s*([+-])\s*\)\s*$/, (m) => (m[2] === '+' ? 1 : -1) * (m[1] ? +m[1] : 1)],
      [/\s+(\d*)\s*([+-])\s*$/, (m) => (m[2] === '+' ? 1 : -1) * (m[1] ? +m[1] : 1)],
      [/([+-])(\d+)\s*$/, (m) => (m[1] === '+' ? 1 : -1) * +m[2]],
      [/([+-])\s*$/, (m) => (m[1] === '+' ? 1 : -1)]
    ];
    for (const [re, f] of tries) {
      const mm = s.match(re);
      if (mm) return { charge: f(mm), rest: s.slice(0, mm.index) };
    }
    return { charge: null, rest: s };
  }
  function tokenize(str) {
    // strict (case sensitive)
    const toks = [];
    const re = /([A-Z][a-z]?)(\d*)/g;
    let m, last = 0;
    while ((m = re.exec(str))) {
      if (m.index !== last) return null;
      last = re.lastIndex;
      if (!EL[m[1]]) return null;
      toks.push([m[1], m[2] ? +m[2] : 1]);
    }
    return last === str.length && toks.length ? toks : null;
  }
  function tokenizeLoose(str) {
    const s = str.toLowerCase();
    const toks = [];
    let i = 0;
    while (i < s.length) {
      let found = null;
      for (const len of [2, 1]) {
        const cand = s.substr(i, len);
        const key = EL_KEYS.find((k) => k.toLowerCase() === cand);
        if (key) { found = [key, len]; break; }
      }
      if (!found) return null;
      i += found[1];
      let d = '';
      while (i < s.length && /\d/.test(s[i])) d += s[i++];
      toks.push([found[0], d ? +d : 1]);
    }
    return toks.length ? toks : null;
  }
  function mergeToks(toks) {
    const out = [];
    toks.forEach(([e, n]) => {
      const f = out.find((x) => x[0] === e);
      if (f) f[1] += n; else out.push([e, n]);
    });
    return out;
  }
  function parseInput(raw) {
    let s = String(raw == null ? '' : raw).trim();
    if (!s) return { error: 'empty' };
    const pc = parseCharge(s);
    let body = normalize(pc.rest).replace(/[\s·.]/g, '');
    if (!body) return { error: 'empty' };
    const toks = tokenize(body) || tokenizeLoose(body);
    if (!toks) return { error: 'bad' };
    return { toks: mergeToks(toks), charge: pc.charge };
  }
  function tokString(toks) { return toks.map(([e, n]) => e + (n > 1 ? n : '')).join(''); }

  /* ---------- Per-state analysis ---------- */
  // state = { order:[per ligand], lp:[per atom, index 0 = central] }
  function analyze(sol, st) {
    const atoms = sol.atoms;
    const bonds = atoms.map(() => 0);
    st.order.forEach((o, i) => { bonds[0] += o; bonds[i + 1] += o; });
    return atoms.map((a, i) => {
      const v = EL[a.el].v;
      const shell = 2 * st.lp[i] + 2 * bonds[i];
      return { el: a.el, v, lp: st.lp[i], bonds: bonds[i], fc: v - 2 * st.lp[i] - bonds[i], shell };
    });
  }
  const cloneState = (st) => ({ order: st.order.slice(), lp: st.lp.slice() });
  const sig = (st) => st.order.join('') + '|' + st.lp.join('');
  const usedElectrons = (st) => st.lp.reduce((a, b) => a + 2 * b, 0) + st.order.reduce((a, b) => a + 2 * b, 0);

  /* ---------- VSEPR names ---------- */
  function geometry(n, lpC) {
    const d = n + lpC;
    const k = d + ':' + lpC;
    const t = {
      '1:0': 'خطی', '2:0': 'خطی', '3:0': 'مثلثی مسطح', '3:1': 'خمیده (V شکل)',
      '4:0': 'چهاروجهی', '4:1': 'هرمی با قاعده‌ی مثلثی', '4:2': 'خمیده (V شکل)',
      '5:0': 'دوهرم مثلثی', '5:1': 'الاکلنگی', '5:2': 'T شکل', '5:3': 'خطی',
      '6:0': 'هشت‌وجهی', '6:1': 'هرم مربعی', '6:2': 'مربعی مسطح'
    };
    if (n === 1) return 'خطی';
    return t[k] || '—';
  }

  /* ---------- Solver ---------- */
  function chooseCentral(list, forced) {
    const uniq = [...new Set(list)];
    if (forced && uniq.includes(forced)) return forced;
    let cand = uniq.filter((e) => e !== 'H');
    if (!cand.length) cand = uniq;
    cand = cand.slice().sort((a, b) => EL[a].en - EL[b].en);
    return cand[0];
  }

  function solve(input, charge, opts) {
    opts = opts || {};
    const mode = opts.mode === 'octet' ? 'octet' : 'min';
    const parsed = typeof input === 'string' ? parseInput(input) : { toks: input };
    if (parsed.error) return { ok: false, error: parsed.error === 'empty' ? 'فرمول را وارد کنید.' : 'فرمول قابل تشخیص نیست. نمونه: SO2Cl2 یا NH4+ یا SO4^2-' };
    if (charge == null) charge = parsed.charge == null ? 0 : parsed.charge;
    const toks = parsed.toks;
    const flat = [];
    toks.forEach(([e, n]) => { for (let i = 0; i < n; i++) flat.push(e); });
    if (flat.length < 2) return { ok: false, error: 'حداقل دو اتم لازم است.' };
    if (flat.length > 7) return { ok: false, error: 'این نسخه فقط ترکیب‌هایی با یک اتم مرکزی و حداکثر ۶ اتم جانبی را رسم می‌کند.' };

    const centralEl = chooseCentral(flat, opts.central);
    const rest = flat.slice();
    rest.splice(rest.indexOf(centralEl), 1);
    // group ligands: fewer first, then more electronegative first; H first when only two ligands
    const groups = {};
    rest.forEach((e) => { groups[e] = (groups[e] || 0) + 1; });
    const order = Object.keys(groups).sort((a, b) => {
      if (rest.length === 2 && (a === 'H' || b === 'H')) return a === 'H' ? -1 : 1;
      if (groups[a] !== groups[b]) return groups[a] - groups[b];
      return EL[b].en - EL[a].en;
    });
    const ligs = [];
    order.forEach((e) => { for (let i = 0; i < groups[e]; i++) ligs.push(e); });
    const n = ligs.length;
    const atoms = [{ el: centralEl }].concat(ligs.map((e) => ({ el: e })));

    const total = flat.reduce((s, e) => s + EL[e].v, 0) - charge;
    const baseInfo = { atoms, total, charge, mode, central: centralEl, n, formulaToks: toks };
    if (total < 0) return Object.assign({ ok: false, error: 'بار انتخاب‌شده با تعداد الکترون‌ها سازگار نیست.' }, baseInfo);
    if (total % 2 === 1) return Object.assign({ ok: false, error: 'تعداد کل الکترون‌های ظرفیت فرد است (' + fa(total) + ')؛ این گونه رادیکال است و با روش جفت‌الکترونی رسم نمی‌شود.' }, baseInfo);

    const steps = [];
    const st0 = { order: ligs.map(() => 0), lp: atoms.map(() => 0) };

    // Step 1: count electrons
    const rows = toks.map(([e, c]) => ({ el: e, count: c, v: EL[e].v, sum: c * EL[e].v }));
    steps.push({ kind: 'count', state: cloneState(st0), rows, total, charge, showFC: false });

    // Step 2: skeleton
    const st = { order: ligs.map(() => 1), lp: atoms.map(() => 0) };
    let remaining = total - 2 * n;
    if (remaining < 0) return Object.assign({ ok: false, error: 'الکترون‌ها برای رسم پیوندهای اسکلت کافی نیست.' }, baseInfo);
    steps.push({ kind: 'skeleton', state: cloneState(st), used: 2 * n, remaining, forced: !!opts.central, showFC: false });

    // Step 3: terminal atoms
    const procOrder = ligs.map((e, i) => i).sort((a, b) => EL[ligs[b]].en - EL[ligs[a]].en);
    let termUsed = 0;
    procOrder.forEach((i) => {
      if (ligs[i] === 'H') return;
      const needPairs = 3;
      const give = Math.min(needPairs, Math.floor(remaining / 2));
      st.lp[i + 1] = give;
      remaining -= 2 * give;
      termUsed += 2 * give;
    });
    const hasTerminalWork = ligs.some((e) => e !== 'H');
    if (hasTerminalWork) steps.push({ kind: 'terminal', state: cloneState(st), used: termUsed, remaining, showFC: false });

    // Step 4: leftover onto central
    if (remaining > 0) {
      st.lp[0] = remaining / 2;
      const left = remaining;
      remaining = 0;
      steps.push({ kind: 'central', state: cloneState(st), used: left, remaining: 0, showFC: false });
    }

    // Step 5: formal charges, then convert lone pairs into multiple bonds
    const centralP = EL[centralEl].p;
    const cap = (shellAfter) => (mode === 'min' && centralP >= 3) || shellAfter <= 8;
    let info = analyze({ atoms }, st);
    steps.push({ kind: 'fc', state: cloneState(st), showFC: true });
    let guard = 0;
    while (guard++ < 12) {
      info = analyze({ atoms }, st);
      if (info[0].fc <= 0) break;
      let best = -1;
      for (let j = 1; j <= n; j++) {
        if (info[j].fc < 0 && st.lp[j] > 0 && st.order[j - 1] < 3 && cap(info[0].shell + 2)) {
          if (best < 0 || info[j].fc < info[best].fc) best = j;
        }
      }
      if (best < 0) break;
      st.lp[best] -= 1;
      st.order[best - 1] += 1;
      steps.push({ kind: 'convert', why: 'fc', atom: best, state: cloneState(st), showFC: true });
    }
    guard = 0;
    while (guard++ < 12 && !DEFICIENT[centralEl]) {
      info = analyze({ atoms }, st);
      if (info[0].shell >= 8) break;
      let best = -1;
      for (let j = 1; j <= n; j++) {
        if (st.lp[j] > 0 && st.order[j - 1] < 3) { best = j; break; }
      }
      if (best < 0) break;
      st.lp[best] -= 1;
      st.order[best - 1] += 1;
      steps.push({ kind: 'convert', why: 'octet', atom: best, state: cloneState(st), showFC: true });
    }
    info = analyze({ atoms }, st);
    const final = cloneState(st);

    // Validate electron bookkeeping
    const bookkeeping = usedElectrons(final) === total;

    // Resonance variants
    const resonance = buildResonance(atoms, final);

    const sol = Object.assign({}, baseInfo, {
      ok: true, steps, final, info, resonance, bookkeeping,
      geometry: geometry(n, final.lp[0]),
      expanded: info[0].shell > 8,
      centralLp: final.lp[0]
    });
    // Layout is based on the final central lone pairs
    sol.angles = layoutAngles(n, final.lp[0]);
    return sol;
  }

  function buildResonance(atoms, final) {
    const n = atoms.length - 1;
    const byEl = {};
    for (let i = 1; i <= n; i++) (byEl[atoms[i].el] = byEl[atoms[i].el] || []).push(i);
    let variants = [cloneState(final)];
    Object.keys(byEl).forEach((e) => {
      const idx = byEl[e];
      const sigs = idx.map((i) => final.order[i - 1] + ':' + final.lp[i]);
      if (new Set(sigs).size < 2) return;
      const perms = uniquePerms(sigs);
      const next = [];
      variants.forEach((v) => {
        perms.forEach((p) => {
          const s = cloneState(v);
          idx.forEach((i, k) => {
            const [o, l] = p[k].split(':').map(Number);
            s.order[i - 1] = o;
            s.lp[i] = l;
          });
          next.push(s);
        });
      });
      variants = next;
    });
    const seen = new Set();
    const out = [];
    variants.forEach((v) => { const s = sig(v); if (!seen.has(s)) { seen.add(s); out.push(v); } });
    return out.slice(0, 12);
  }
  function uniquePerms(arr) {
    const res = new Set();
    const rec = (cur, left) => {
      if (!left.length) { res.add(JSON.stringify(cur)); return; }
      const seen = new Set();
      left.forEach((x, i) => {
        if (seen.has(x)) return;
        seen.add(x);
        rec(cur.concat(x), left.slice(0, i).concat(left.slice(i + 1)));
      });
    };
    rec([], arr);
    return [...res].map((s) => JSON.parse(s));
  }

  /* ---------- Layout ---------- */
  function layoutAngles(n, centralLp) {
    switch (n) {
      case 1: return [0];
      case 2: return [180, 0];
      case 3: return centralLp > 0 ? [180, 0, 90] : [-90, 150, 30];
      case 4: return [-90, 90, 180, 0];
      case 5: return [-90, -18, 54, 126, 198];
      default: return [-90, -30, 30, 90, 150, 210].slice(0, n);
    }
  }
  const norm360 = (a) => ((a % 360) + 360) % 360;
  const angDist = (a, b) => { const d = Math.abs(norm360(a) - norm360(b)); return Math.min(d, 360 - d); };

  // choose k directions (degrees, screen coords: +x right, +y down) as far as possible from `occupied`
  function placePairs(occupied, k) {
    if (k <= 0) return [];
    const cands = [];
    for (let a = -90; a < 270; a += 15) cands.push(a);
    // order candidates so that "up" ones are tried first
    cands.sort((a, b) => Math.sin((a * Math.PI) / 180) - Math.sin((b * Math.PI) / 180));
    let bestScore = -Infinity, best = null;
    const pick = (start, chosen) => {
      if (chosen.length === k) {
        const all = occupied.concat(chosen).map(norm360).sort((x, y) => x - y);
        const gaps = [];
        for (let i = 0; i < all.length; i++) {
          const nxt = i === all.length - 1 ? all[0] + 360 : all[i + 1];
          gaps.push(nxt - all[i]);
        }
        const mn = Math.min.apply(null, gaps);
        const mean = 360 / gaps.length;
        const varc = gaps.reduce((s, g) => s + (g - mean) * (g - mean), 0) / gaps.length;
        const up = chosen.reduce((s, a) => s + Math.sin((a * Math.PI) / 180), 0);
        const score = mn * 1000 - varc - up * 0.01;
        if (score > bestScore + 1e-9) { bestScore = score; best = chosen.slice(); }
        return;
      }
      for (let i = start; i < cands.length; i++) {
        if (occupied.some((o) => angDist(o, cands[i]) < 1)) continue;
        chosen.push(cands[i]);
        pick(i + 1, chosen);
        chosen.pop();
      }
    };
    pick(0, []);
    return best || [];
  }

  /* ---------- Steps → Persian text ---------- */
  const SYM = (e) => '<span class="sym">' + e + '</span>';

    sol.steps.forEach((s) => {

        if (charge !== 0) {
          rowsHtml += '<tr><td colspan="2">' + (charge < 0 ? 'بار منفی: ' + fa(-charge) + ' الکترون اضافه' : 'بار مثبت: ' + fa(charge) + ' الکترون کم') + '</td><td class="num">' + (charge < 0 ? '+' : '−') + fa(Math.abs(charge)) + '</td></tr>';

          '<p>این ' + fa(total) + ' الکترون، <b>' + fa(total / 2) + ' جفت</b> می‌شود و باید همه‌ی آن‌ها را جایگذاری کنیم.</p>';
        o.counter = { used: 0, total };
      } else if (s.kind === 'skeleton') {
        o.title = 'اتم مرکزی و اسکلت پیوندها';

          (n === 1 ? 'دو اتم را مستقیم به هم وصل می‌کنیم.' : 'اتم مرکزی ' + SYM(central) + ' است؛ چون کم‌الکترونگاتیوترین اتم است (هیدروژن هیچ‌وقت اتم مرکزی نمی‌شود).');
        o.html = '<p>' + why + ' هر اتم جانبی را با یک پیوند یگانه به آن وصل می‌کنیم.</p>' +
          '<p>' + fa(n) + ' پیوند × ۲ = <b>' + fa(s.used) + '</b> الکترون مصرف شد؛ <b>' + fa(s.remaining) + '</b> الکترون باقی می‌ماند.</p>';
        o.counter = { used: s.used, total };
      } else if (s.kind === 'terminal') {
        o.title = 'کامل کردن اتم‌های جانبی';
        o.highlight = atoms.map((a, i) => i).filter((i) => i > 0 && atoms[i].el !== 'H');
        o.html = '<p>به هر اتم جانبی (از الکترونگاتیوترین شروع می‌کنیم) جفت ناپیوندی می‌دهیم تا هشتایی شود. هیدروژن فقط دو الکترون می‌خواهد و جفت ناپیوندی نمی‌گیرد.</p>' +
          '<p>این مرحله <b>' + fa(s.used) + '</b> الکترون مصرف کرد؛ <b>' + fa(s.remaining) + '</b> الکترون باقی می‌ماند.</p>';
        o.counter = { used: usedElectrons(s.state), total };
      } else if (s.kind === 'central') {
        o.title = 'الکترون‌های باقی‌مانده روی اتم مرکزی';
        o.highlight = [0];
        o.html = '<p>' + fa(s.used) + ' الکترون (' + fa(s.used / 2) + ' جفت) باقی مانده است. آن‌ها را روی اتم مرکزی ' + SYM(central) + ' به صورت جفت ناپیوندی می‌گذاریم.</p>' +
          '<p>حالا همه‌ی ' + fa(total) + ' الکترون جایگذاری شده‌اند.</p>';
        o.counter = { used: usedElectrons(s.state), total };
      } else if (s.kind === 'fc') {
        o.title = 'بررسی بار رسمی';
        const inf = infoAt(s.state);
        const nz = inf.map((x, i) => ({ x, i })).filter((r) => r.x.fc !== 0);
        let t = '<p class="formula-note">بار رسمی = (الکترون ظرفیت) − (الکترون‌های ناپیوندی) − (تعداد پیوندها)</p>';
        if (!nz.length) {
          t += '<p>بار رسمی همه‌ی اتم‌ها صفر است و هشتایی‌ها کامل است؛ ساختار پایدار است.</p>';
        } else {
          t += '<p>بار رسمی اتم‌ها: ' + inf.map((r) => SYM(r.el) + ' <b class="' + (r.fc > 0 ? 'pos' : r.fc < 0 ? 'neg' : '') + '">' + faSigned(r.fc) + '</b>').join('،  ') + '</p>';
        }
        o.html = t;
        o.highlight = nz.map((r) => r.i);
        o.counter = { used: usedElectrons(s.state), total };
      } else if (s.kind === 'convert') {
        const inf = infoAt(s.state);
        const a = atoms[s.atom].el;
        o.highlight = [0, s.atom];
        if (s.why === 'fc') {
          o.title = 'کاهش بار رسمی با پیوند چندگانه';
          o.html = '<p>اتم مرکزی بار مثبت دارد و ' + SYM(a) + ' بار منفی. یک جفت ناپیوندی ' + SYM(a) + ' را به پیوند دوم (یا سوم) با ' + SYM(central) + ' تبدیل می‌کنیم. تعداد الکترون‌ها تغییر نمی‌کند، ولی بارها کم می‌شوند.</p>' +
            '<p>بار رسمی اتم‌ها: ' + inf.map((r) => SYM(r.el) + ' <b class="' + (r.fc > 0 ? 'pos' : r.fc < 0 ? 'neg' : '') + '">' + faSigned(r.fc) + '</b>').join('،  ') + '</p>';
        } else {
          o.title = 'تکمیل هشتایی اتم مرکزی';
          o.html = '<p>اتم مرکزی هنوز هشتایی نشده است. یک جفت ناپیوندی ' + SYM(a) + ' را به پیوند چندگانه تبدیل می‌کنیم تا هشتایی ' + SYM(central) + ' کامل شود.</p>';
        }
        o.counter = { used: usedElectrons(s.state), total };
      }
      out.push(o);
    });
    // final step
    const inf = sol.info;
    let h = '';
    const okOct = inf.every((r, i) => (r.el === 'H' ? r.shell === 2 : r.shell >= 8 || DEFICIENT[r.el]));
    h += '<ul class="checks">';
    h += '<li class="ok">جمع الکترون‌های ساختار = ' + fa(usedElectrons(sol.final)) + ' (برابر با ' + fa(total) + ')</li>';
    if (okOct) h += '<li class="ok">قاعده‌ی هشتایی (برای H دوتایی) رعایت شد</li>';
    else h += '<li class="warn">در این ساختار همه‌ی اتم‌ها به هشتایی نرسیده‌اند</li>';
    if (sol.expanded) h += '<li class="info">' + SYM(central) + ' در دوره‌ی ' + fa(EL[central].p) + ' است و می‌تواند بیش از ۸ الکترون داشته باشد (گسترش هشتایی). در حالت «هشتایی سخت‌گیرانه» بارهای رسمی بیشتر می‌شوند.</li>';
    if (sol.mode === 'octet' && inf.some((r) => r.fc !== 0)) h += '<li class="info">در حالت هشتایی سخت‌گیرانه، پیوند چندگانه فقط تا جایی که از ۸ الکترون نگذرد ساخته می‌شود.</li>';
    if (charge !== 0) h += '<li class="info">چون ذره بار ' + faSigned(charge) + ' دارد، ساختار را داخل کروشه و همراه بار کلی می‌نویسیم.</li>';
    if (sol.resonance.length > 1) h += '<li class="info">این ساختار <b>' + fa(sol.resonance.length) + ' شکل رزونانسی</b> هم‌ارز دارد؛ ساختار واقعی ترکیبی از همه‌ی آن‌هاست و پیوندهای هم‌نوع طول برابر دارند.</li>';
    h += '<li class="info">شکل مولکول (VSEPR): <b>' + sol.geometry + '</b></li>';
    h += '</ul>';
    out.push({ kind: 'final', title: 'ساختار نهایی', html: h, state: sol.final, showFC: true, highlight: [], counter: { used: usedElectrons(sol.final), total } });
    return out;
  }

  /* ---------- Accepted answers (for practice) ---------- */
  function acceptedSigs(toks, charge, central) {

    ['min', 'octet'].forEach((mode) => {

      if (!s.ok) return;
      s.resonance.forEach((v) => { if (!set.has(sig(v))) set.set(sig(v), mode); });
    });
    return set;
  }

<script>
/* ===== Balance engine: parsing, exact balancing, and "وارسی" (inspection) steps ===== */
(function (root) {
  'use strict';

  const SYMS = new Set(('H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U').split(' '));

  const fa = (x) => String(x).replace(/\d/g, (d) => FA[+d]);

  /* ---------- fractions ---------- */
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; };

  const fmul = (a, b) => fr(a.n * b.n, a.d * b.d);

  const fint = (a) => a.d === 1;

  /* ---------- formula parsing ---------- */
  function normalizeText(s) {

      .replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
      .replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))

      .replace(/＋/g, '+');

  function parseFormulaCounts(f) {
    // supports (), [], {GROUP} pseudo-elements and hydrate dot
    const parts = f.split(/[·.]/);
    const total = {};
    const order = [];
    const add = (el, n, target) => { if (!(el in target)) target[el] = 0; target[el] += n; };
    for (const part0 of parts) {
      let part = part0, mult = 1;
      const mm = part.match(/^(\d+)(.*)$/);
      if (mm && parts.length > 1) { mult = +mm[1]; part = mm[2]; }
      let i = 0;
      const stack = [{}];
      const readNum = () => { let s = ''; while (i < part.length && /\d/.test(part[i])) s += part[i++]; return s ? +s : 1; };
      while (i < part.length) {
        const ch = part[i];
        if (ch === '(' || ch === '[') { stack.push({}); i++; }
        else if (ch === ')' || ch === ']') {
          i++;
          const n = readNum();
          const top = stack.pop();
          if (!stack.length) throw new Error('پرانتز اضافه');
          Object.keys(top).forEach((e) => add(e, top[e] * n, stack[stack.length - 1]));
        } else if (ch === '{') {
          const j = part.indexOf('}', i);
          const name = part.slice(i, j + 1);
          i = j + 1;
          add(name, readNum(), stack[stack.length - 1]);
        } else if (/[A-Z]/.test(ch)) {
          let el = ch; i++;
          if (i < part.length && /[a-z]/.test(part[i])) { el += part[i]; i++; }
          if (!SYMS.has(el)) {

          }

      }
      if (stack.length !== 1) throw new Error('پرانتز بسته نشده');
      Object.keys(stack[0]).forEach((e) => { if (!(e in total)) order.push(e); add(e, stack[0][e] * mult, total); });
    }
    return { counts: total, order };

  const ARROW = /\s*(?:<->|<=>|-->|->|⟶|→|⇒|=>|=)\s*/;
  function parseEquation(text) {
    const t = normalizeText(text).trim();
    if (!t) return { error: 'معادله را بنویس. نمونه: CH4 + O2 -> CO2 + H2O' };
    const sides = t.split(ARROW);
    if (sides.length !== 2 || !sides[0].trim() || !sides[1].trim()) return { error: 'معادله باید یک فلش داشته باشد: مواد اولیه -> فراورده‌ها' };
    const mk = (s) => s.split(/\s*\+\s*/).map((x) => x.trim()).filter(Boolean);
    const out = { reactants: [], products: [] };
    for (const [key, side] of [['reactants', sides[0]], ['products', sides[1]]]) {
      const items = mk(side);
      if (!items.length) return { error: 'هر دو طرف معادله باید ماده داشته باشند.' };
      for (let raw of items) {
        raw = raw.replace(/\s+/g, '');
        let state = null;
        const sm = raw.match(/\((g|l|s|aq)\)$/i);
        if (sm) { state = sm[1].toLowerCase(); raw = raw.slice(0, sm.index); }
        const cm = raw.match(/^(\d+)(.+)$/);
        if (cm && /[A-Z(\[]/.test(cm[2][0])) raw = cm[2];
        if (!raw) return { error: 'یک ماده خالی است.' };
        try { parseFormulaCounts(raw); } catch (e) { return { error: 'در «' + raw + '»: ' + e.message }; }
        out[key].push({ f: raw, state });
      }
    }
    return out;
  }

  /* ---------- group (polyatomic) detection ---------- */
  function applyGroups(eq, relaxed) {
    const all = eq.reactants.concat(eq.products);
    const used = [];
    let forms = all.map((s) => s.f);
    for (const g of GROUPS) {
      const re = new RegExp(g + '(?![0-9a-z])', 'g');
      const has = (idx) => { re.lastIndex = 0; return re.test(forms[idx]); };
      const rHas = eq.reactants.some((s, i) => has(i));
      const pHas = eq.products.some((s, i) => has(eq.reactants.length + i));
      if (!rHas || !pHas) continue;
      const next = forms.map((f) => f.replace(re, '{' + g + '}'));
      // key element must not remain elsewhere
      const key = g.match(/^[A-Z][a-z]?/)[0];
      let leaks = false;
      next.forEach((f) => { try { const c = parseFormulaCounts(f).counts; if (c[key]) leaks = true; } catch (e) { leaks = true; } });
      if (leaks && !relaxed) continue;
      forms = next; used.push(g);
    }
    return { forms, used };
  }

  /* ---------- exact balancing (nullspace) ---------- */
  function buildMatrix(species, sideOf, forms) {
    const counts = species.map((s, i) => parseFormulaCounts(forms ? forms[i] : s.f).counts);
    const elems = [];
    counts.forEach((c) => Object.keys(c).forEach((e) => { if (elems.indexOf(e) < 0) elems.push(e); }));
    const A = elems.map((e) => counts.map((c, j) => fr((c[e] || 0) * (sideOf[j] === 'R' ? 1 : -1))));
    return { counts, elems, A };
  }
  function nullspace(A, ncols) {
    const M = A.map((r) => r.slice());
    const pivots = [];
    let row = 0;
    for (let c = 0; c < ncols && row < M.length; c++) {
      let p = -1;
      for (let r = row; r < M.length; r++) if (!fz(M[r][c])) { p = r; break; }
      if (p < 0) continue;
      [M[row], M[p]] = [M[p], M[row]];
      const pv = M[row][c];
      M[row] = M[row].map((x) => fdiv(x, pv));
      for (let r = 0; r < M.length; r++) {
        if (r !== row && !fz(M[r][c])) {
          const f = M[r][c];
          M[r] = M[r].map((x, k) => fsub(x, fmul(f, M[row][k])));
        }
      }
      pivots.push(c); row++;
    }
    const free = [];
    for (let c = 0; c < ncols; c++) if (pivots.indexOf(c) < 0) free.push(c);
    return free.map((fc) => {
      const v = new Array(ncols).fill(null).map(() => fr(0));
      v[fc] = fr(1);
      pivots.forEach((pc, r) => { v[pc] = fr(-M[r][fc].n, M[r][fc].d); });
      return v;
    });
  }

  function balanceEquation(eq, forms) {
    const species = eq.reactants.concat(eq.products);
    const sideOf = species.map((s, i) => (i < eq.reactants.length ? 'R' : 'P'));
    let mat;
    try { mat = buildMatrix(species, sideOf, forms); } catch (e) { return { ok: false, error: e.message }; }
    const { elems, A, counts } = mat;
    for (const e of elems) {
      const inR = species.some((s, j) => sideOf[j] === 'R' && counts[j][e]);
      const inP = species.some((s, j) => sideOf[j] === 'P' && counts[j][e]);
      if (!inR || !inP) return { ok: false, error: 'عنصر ' + e + ' فقط در یک طرف معادله دیده می‌شود. معمولاً یک ماده جا افتاده یا اشتباه نوشته شده است.' };
    }
    const ns = nullspace(A, species.length);
    if (!ns.length) return { ok: false, error: 'این معادله با همین مواد قابل موازنه نیست. فرمول‌ها را دوباره بررسی کن؛ شاید ماده‌ای (مثلاً H₂O) جا افتاده باشد.' };
    if (ns.length > 1) return { ok: false, nullity: ns.length, error: 'این معادله بیش از یک جواب مستقل دارد (احتمالاً دو واکنش جدا در یک معادله است).' };
    let v = ns[0];
    const L = v.reduce((a, x) => lcm(a, x.d), 1);
    let ints = v.map((x) => (x.n * L) / x.d);
    const g = ints.reduce((a, x) => gcd(a, x), 0);
    ints = ints.map((x) => x / g);
    if (ints.every((x) => x < 0)) ints = ints.map((x) => -x);
    if (ints.some((x) => x <= 0)) return { ok: false, error: 'برای این معادله ضرایب مثبت پیدا نشد؛ جهت یا مواد واکنش را بررسی کن.' };
    return { ok: true, ints, elems, counts, sideOf };
  }

  /* ---------- inspection (وارسی) simulation ---------- */
  function sideName(s) { return s === 'R' ? 'چپ' : 'راست'; }

  function inspect(eq, forms, bal) {
    const species = eq.reactants.concat(eq.products);
    const n = species.length;
    const { counts, elems, sideOf, ints } = bal;
    const isFree = counts.map((c) => Object.keys(c).length === 1);
    const total = counts.map((c) => Object.values(c).reduce((a, b) => a + b, 0));
    const distinct = counts.map((c) => Object.keys(c).length);
    const elemSpecies = {};
    elems.forEach((e) => { elemSpecies[e] = []; counts.forEach((c, j) => { if (c[e]) elemSpecies[e].push(j); }); });
    const freeInv = {};
    elems.forEach((e) => { freeInv[e] = elemSpecies[e].some((j) => isFree[j]); });
    const label = (e) => (e[0] === '{' ? e.slice(1, -1) : e);

    // Rule 1: starter
    const candEl = elems.filter((e) => {
      const r = elemSpecies[e].filter((j) => sideOf[j] === 'R').length;
      const p = elemSpecies[e].filter((j) => sideOf[j] === 'P').length;
      return r === 1 && p === 1 && !freeInv[e];
    });
    let candSp = [];
    candEl.forEach((e) => elemSpecies[e].forEach((j) => { if (candSp.indexOf(j) < 0 && !isFree[j]) candSp.push(j); }));
    let fallback = false;
    if (!candSp.length) {
      fallback = true;
      candSp = species.map((s, j) => j).filter((j) => !isFree[j]);
      if (!candSp.length) candSp = species.map((s, j) => j);

    const ratio = (j) => fr(ints[j], ints[starter]);
    const known = new Array(n).fill(null);

    const steps = [];
    const snap = () => known.map((k) => (k ? { n: k.n, d: k.d } : null));
    steps.push({ kind: 'start', rule: 'نکته', coefs: new Array(n).fill(null), species: -1 });
    steps.push({ kind: 'starter', rule: 'قاعده‌ی اول', species: starter, candEl: candEl.slice(), fallback, coefs: snap(), order: [starter] });

      const evalEl = (e) => {
        const unk = elemSpecies[e].filter((j) => !known[j]);

        const u = unk[0];
        const side = sideOf[u], opp = side === 'R' ? 'P' : 'R';

        let T = fr(0), K = fr(0);
        oppSp.forEach((j) => { T = fadd(T, contrib(e, j)); });
        sameSp.forEach((j) => { K = fadd(K, contrib(e, j)); });

        const oneSideKnown = oppSp.length > 0 && (sameSp.length === 0 || sameSp.every((j) => known[j]));
        return { e, u, side, opp, oppSp, sameSp, T, K, val, oneSideKnown };
      };
      const evals = elems.map(evalEl).filter(Boolean);
      const pref = (list) => list.filter((x) => !freeInv[x.e]);
      let pool = pref(evals);
      let ruleTag = 'قاعده‌ی دوم';
      if (!pool.length) { pool = evals; if (pool.length) ruleTag = 'قاعده‌ی سوم'; }
      if (pool.length) {
        pick = pool[0];
        pick.rule = ruleTag;
      }
      if (!pick) {
        // helper: no element has exactly one unknown species
        const unk = species.map((s, j) => j).filter((j) => !known[j]);
        unk.sort((a, b) => total[b] - total[a] || a - b);
        const j = unk[0];
        known[j] = ratio(j);
        order.push(j);
        steps.push({ kind: 'helper', rule: 'گام کمکی', species: j, val: known[j], coefs: snap() });
        continue;
      }
      if (!(pick.val.n > 0)) {
        // inconsistent with a positive answer: fall back to the exact ratio
        const j = pick.u; known[j] = ratio(j); order.push(j);
        steps.push({ kind: 'helper', rule: 'گام کمکی', species: j, val: known[j], coefs: snap() });
        continue;
      }
      known[pick.u] = pick.val;
      order.push(pick.u);
      steps.push({ kind: 'solve', rule: pick.rule, element: pick.e, species: pick.u, side: pick.side, oppSp: pick.oppSp, sameSp: pick.sameSp, T: pick.T, K: pick.K, val: pick.val, free: freeInv[pick.e], coefs: snap(), elementFreeSp: elemSpecies[pick.e].filter((j) => isFree[j]) });
    }
    // sanity: matches exact ratios
    for (let j = 0; j < n; j++) {
      const r = ratio(j);
      if (known[j].n !== r.n || known[j].d !== r.d) { known[j] = r; }
    }
    const L = known.reduce((a, x) => lcm(a, x.d), 1);
    const hasFrac = L > 1;
    if (hasFrac) steps.push({ kind: 'fraction', rule: 'نکته‌ی ۱', L, before: snap(), coefs: known.map((x) => fr(x.n * (L / x.d))) });
    let finalInts = known.map((x) => (x.n * L) / x.d);
    const g = finalInts.reduce((a, x) => gcd(a, x), 0);
    if (g > 1) { steps.push({ kind: 'simplify', rule: 'نکته‌ی ۲', g, before: finalInts.map((x) => fr(x)), coefs: finalInts.map((x) => fr(x / g)) }); finalInts = finalInts.map((x) => x / g); }
    steps.push({ kind: 'final', rule: 'بررسی نهایی', coefs: finalInts.map((x) => fr(x)) });
    return { steps, order, starter, finalInts, label, symHTML, isFree, total, distinct, counts, elems, sideOf, species };
  }

  /* ---------- everything together ---------- */
  function analyzeEquation(text) {

      const g = applyGroups(eq, true);
      if (g.used.length) {

    const pm = buildMatrix(species, sideOf, null);
    const plain = { elems: pm.elems, counts: pm.counts };
    const res0 = { species, nR: eq.reactants.length, plain };

      species.forEach((s, j) => { const c = coefs[j] * (plain.counts[j][e] || 0); if (j < nR) l += c; else r += c; });
      return { el: e, left: l, right: r };
    });
    return out;

    const sol = solveCmp(cmpOf(lib));
    return lewisSVG(sol, sol.final, { fit: fit || [130, 76], scale: 0.5, showFC: false });
  }

  const VIEWS = {};

  VIEWS.home = () => {
    const rec = S.recent && libById(S.recent);
    const h2o = libById('h2o');
    const hero = rec
      ? '<div class="hero"><div><h2>ادامه‌ی یادگیری</h2><p>آخرین ترکیب: ' + E.formulaHTML(rec.f, rec.c) + ' (' + rec.fa + ')</p></div><button class="btn" data-act="open" data-id="' + rec.id + '">ادامه</button></div>'
      : '<div class="hero"><div><h2>از شمارش الکترون تا ساختار نهایی</h2><p>با مثال آب شروع کن؛ هر مرحله را جدا می‌بینی.</p></div><button class="btn" data-act="open" data-id="h2o" data-tab="steps">شروع</button></div>';
    const tiles = MODULES.map((m) => {
      const ic = m.ic.indexOf('mini:') === 0 ? miniOf(libById(m.ic.slice(5)), [130, 46]) : lineIcon(m.ic);
      return '<button class="tile' + (m.soon ? ' soon' : '') + '" data-act="module" data-id="' + m.id + '"><div class="ic">' + ic + '</div><b>' + m.title + '</b><span class="s">' + m.sub + '</span>' + (m.soon ? '<i class="badge">به‌زودی</i>' : '') + '</button>';
    }).join('');
    return {
      title: 'ساختار لوویس', subtitle: 'یار شیمی دبیرستان', root: true,
      html: hero + '<div class="tiles">' + tiles + '</div>' +
        creditCard()
    };
  };

  function libCards() {
    const q = norm(S.lib.q);
    const list = E.LIB.filter((x) => {
      if (S.lib.cat === 'mol' && x.cat !== 'mol') return false;
      if (S.lib.cat === 'ion' && x.cat !== 'ion') return false;
      if (S.lib.cat === 'fav' && !isFav(x.id)) return false;
      if (!q) return true;
      const pi = E.parseInput(S.lib.q);
      if (pi.toks && E.tokString(pi.toks) === x.f && (pi.charge == null || pi.charge === x.c)) return true;
      return norm(x.f).indexOf(q) >= 0 || norm(x.en).indexOf(q) >= 0 || norm(x.fa).indexOf(q) >= 0;
    });
    if (!list.length) return '<div class="empty">' + (S.lib.cat === 'fav' ? 'هنوز ترکیبی را ستاره‌دار نکرده‌ای.' : 'ترکیبی پیدا نشد. می‌توانی فرمولش را در «ساخت از روی فرمول» رسم کنی.') + '</div>';
    return '<div class="grid2">' + list.map((x) =>
      '<div class="cmp"><button class="pic" style="border:0;padding:0;background:var(--surface-2);cursor:pointer" data-act="open" data-id="' + x.id + '" aria-label="' + x.fa + '">' + miniOf(x, [130, 76]) + '</button>' +
      '<div class="f">' + E.formulaHTML(x.f, x.c) + '</div><div class="n">' + x.fa + '</div>' +
      '<button class="star' + (isFav(x.id) ? ' on' : '') + '" data-act="fav" data-id="' + x.id + '" aria-label="ستاره" aria-pressed="' + isFav(x.id) + '">' + icon('star') + '</button></div>').join('') + '</div>';
  }
  VIEWS.library = () => ({
    title: 'کتابخانه‌ی ساختارها', subtitle: fa(E.LIB.length) + ' ترکیب',
    html: '<label class="search">' + icon('search') + '<input id="lib-q" type="search" placeholder="نام فارسی، انگلیسی یا فرمول" value="' + esc(S.lib.q) + '" autocomplete="off" enterkeyhint="search"></label>' +
      '<div class="row">' + [['all', 'همه'], ['mol', 'مولکول‌ها'], ['ion', 'یون‌ها'], ['fav', '★ ستاره‌دار']].map((c) =>
        '<button class="chip" data-act="cat" data-id="' + c[0] + '" aria-pressed="' + (S.lib.cat === c[0]) + '">' + c[1] + '</button>').join('') + '</div>' +
      '<div id="lib-list">' + libCards() + '</div>'
  });

  /* detail */
  function detailHead(cmp) {
    const fav = cmp.id && isFav(cmp.id);
    return '<div class="card head-card"><div class="names"><div class="big">' + E.formulaHTML(cmp.f, cmp.c) + '</div><h2 style="margin-top:2px">' + cmp.fa + '</h2>' + (cmp.en ? '<div class="en">' + cmp.en + '</div>' : '') + '</div>' +
      (cmp.id ? '<button class="star' + (fav ? ' on' : '') + '" style="position:static;width:42px;height:42px" data-act="fav" data-id="' + cmp.id + '" aria-label="ستاره" aria-pressed="' + !!fav + '">' + icon('star') + '</button>' : '') + '</div>';
  }
  function modeSeg() {
    return '<div class="seg" role="group" aria-label="قاعده‌ی رسم"><button data-act="mode" data-id="min" aria-pressed="' + (S.set.mode === 'min') + '">کمینه‌ی بار رسمی</button><button data-act="mode" data-id="octet" aria-pressed="' + (S.set.mode === 'octet') + '">هشتایی سخت‌گیرانه</button></div>';
  }
  function tabsSeg(cur) {
    return '<div class="tabs"><div class="seg" role="tablist">' + [['struct', 'ساختار'], ['steps', 'گام‌به‌گام'], ['table', 'جدول اتم‌ها']].map((t) =>
      '<button role="tab" data-act="tab" data-id="' + t[0] + '" aria-selected="' + (cur === t[0]) + '">' + t[1] + '</button>').join('') + '</div></div>';
  }
  function atomLabel(sol, i) {
    const el = sol.atoms[i].el;
    if (i === 0) return '<span class="sym">' + el + '</span> <small>(مرکزی)</small>';
    const same = sol.atoms.slice(1).filter((a) => a.el === el).length;
    if (same === 1) return '<span class="sym">' + el + '</span>';
    const k = sol.atoms.slice(1, i + 1).filter((a) => a.el === el).length;
    return '<span class="sym">' + el + '</span> ' + fa(k);
  }

  VIEWS.detail = () => {
    const cur = S.cur, cmp = cur.cmp, sol = solveCmp(cmp);
    let body = '';
    if (!sol.ok) {
      body = '<div class="msg err">' + sol.error + '</div>';
      return { title: cmp.fa, back: true, html: detailHead(cmp) + body };
    }
    if (cur.tab === 'struct') {
      const showFC = S.set.fc;
      const info = sol.info;
      const other = solveCmp(cmp, S.set.mode === 'min' ? 'octet' : 'min');
      const same = other.ok && E.sig(other.final) === E.sig(sol.final) && other.resonance.length === sol.resonance.length;
      body += '<div class="canvas dots-bg">' + lewisSVG(sol, sol.final, { showFC, scale: 1.05 }) + '</div>';
      body += '<div class="facts">' +
        '<div class="fact"><span>الکترون‌های ظرفیت</span><b>' + fa(sol.total) + '</b></div>' +
        '<div class="fact"><span>جفت پیوندی</span><b>' + fa(sumOrd(sol.final)) + '</b></div>' +
        '<div class="fact"><span>جفت ناپیوندی</span><b>' + fa(sumLp(sol.final)) + '</b></div>' +
        '<div class="fact"><span>اتم مرکزی</span><b class="sym">' + sol.central + '</b></div>' +
        '<div class="fact" style="grid-column:1/-1"><span>شکل مولکول</span><b>' + sol.geometry + '</b></div></div>';
      body += '<div class="card flat"><h3>قاعده‌ی رسم</h3>' + modeSeg() + '<p class="small muted" style="margin:8px 0 0">' +
        (same ? 'برای این ذره، هر دو حالت یک ساختار می‌دهند.' : (S.set.mode === 'min' ? 'اتم‌های دوره‌ی سوم به بعد می‌توانند بیش از ۸ الکترون داشته باشند تا بار رسمی کمتر شود.' : 'در این حالت هیچ اتمی بیش از ۸ الکترون نمی‌گیرد؛ بار رسمی‌ها ممکن است بیشتر شوند.')) + '</p></div>';
      if (sol.resonance.length > 1) {
        body += '<div class="card flat"><h3>ساختارهای رزونانسی (' + fa(sol.resonance.length) + ')</h3><div class="reso">' +
          sol.resonance.map((v, i) => (i ? '<span class="arrow" aria-hidden="true">↔</span>' : '') + '<div class="rs">' + lewisSVG(sol, v, { showFC, scale: 0.5 }) + '</div>').join('') +
          '</div><p class="small muted" style="margin:0">ساختار واقعی ترکیبی از همه‌ی این شکل‌هاست.</p></div>';
      }
      if (cmp.note) body += '<div class="note">' + cmp.note + '</div>';
      body += '<div class="row nowrap"><button class="btn primary grow" data-act="tab" data-id="steps">مراحل رسم</button><button class="btn grow" data-act="practiceThis">تمرین این ترکیب</button></div>';
    } else if (cur.tab === 'steps') {
      const steps = E.stepsText(sol);
      const i = Math.min(cur.step, steps.length - 1), s = steps[i];
      const pct = s.counter ? Math.round((s.counter.used / s.counter.total) * 100) : 0;
      body += '<div class="card"><div class="row spread" style="margin-bottom:6px"><b class="muted small">گام ' + fa(i + 1) + ' از ' + fa(steps.length) + '</b></div>' +
        '<h2>' + s.title + '</h2>' +
        '<div class="canvas dots-bg" style="margin:8px 0">' + lewisSVG(sol, s.state, { showFC: s.showFC && S.set.fc, highlight: s.highlight, scale: 1 }) + '</div>' +
        (s.counter ? '<div class="counter" aria-label="الکترون‌های جایگذاری‌شده"><div class="progress"><i style="width:' + pct + '%"></i></div><span class="small num" style="white-space:nowrap">' + fa(s.counter.used) + ' از ' + fa(s.counter.total) + '</span></div>' : '') +
        '<div class="step-body" style="margin-top:10px">' + s.html + '</div></div>';
      body += '<div class="dots" role="group" aria-label="گام‌ها">' + steps.map((x, k) => '<button data-act="step" data-id="' + k + '" aria-label="گام ' + fa(k + 1) + '"' + (k === i ? ' aria-current="step"' : '') + (k < i ? ' class="done"' : '') + '></button>').join('') + '</div>';
      body += '<div class="row nowrap"><button class="btn grow" data-act="step" data-id="' + (i - 1) + '"' + (i === 0 ? ' disabled' : '') + '>گام قبلی</button>' +
        (i < steps.length - 1 ? '<button class="btn primary grow" data-act="step" data-id="' + (i + 1) + '">گام بعدی ' + icon('next').replace('<svg', '<svg width="18" height="18" style="stroke:currentColor;fill:none;stroke-width:2"') + '</button>' : '<button class="btn primary grow" data-act="practiceThis">تمرین این ترکیب</button>') + '</div>';
      body += modeSeg();
    } else {
      const info = sol.info;
      body += '<div class="card"><div class="table-wrap"><table><thead><tr><th>اتم</th><th>ظرفیت</th><th>ناپیوندی</th><th>پیوند</th><th>بار رسمی</th><th>الکترون پیرامون</th></tr></thead><tbody>' +
        info.map((r, i) => '<tr><td style="text-align:right">' + atomLabel(sol, i) + '</td><td class="num">' + fa(r.v) + '</td><td class="num">' + fa(r.lp * 2) + '</td><td class="num">' + fa(r.bonds) + '</td><td class="num ' + (r.fc > 0 ? 'pos' : r.fc < 0 ? 'neg' : '') + '">' + faSigned(r.fc) + '</td><td class="num">' + fa(r.shell) + '</td></tr>').join('') +
        '</tbody></table></div><p class="small muted" style="margin:10px 0 0">بار رسمی = ظرفیت − الکترون ناپیوندی − تعداد پیوندها. «الکترون پیرامون» شامل هر دو الکترون هر پیوند است.</p></div>';
    }
    return { title: cmp.fa, back: true, html: detailHead(cmp) + tabsSeg(cur.tab) + body };
  };

  /* solver */
  function solverState() {
    const pi = E.parseInput(S.solver.text);
    if (pi.error) return { err: pi.error === 'empty' ? '' : 'فرمول قابل تشخیص نیست. نمونه: SO2Cl2 ، NH4+ ، SO4^2-', pi };
    const charge = S.solver.charge;
    const cmp = { f: E.tokString(pi.toks), c: charge, toks: pi.toks, central: S.solver.central, fa: 'ساختار دلخواه', en: '', note: '' };
    return { cmp, pi, sol: solveCmp(cmp) };
  }
  function solverPreview() {
    const st = solverState();
    if (st.err !== undefined && !st.cmp) return st.err ? '<div class="msg err">' + st.err + '</div>' : '<div class="msg info">فرمول را بنویس؛ مثلاً CO2 یا NO3 با بار ‎−۱.</div>';
    const { sol, cmp, pi } = st;
    const elems = [...new Set(pi.toks.map((t) => t[0]))];
    let h = '';
    if (elems.length > 1 || pi.toks.some((t) => t[1] > 1)) {
      h += '<div class="field"><label>اتم مرکزی</label><div class="row"><button class="chip" data-act="central" data-id="" aria-pressed="' + !S.solver.central + '">خودکار</button>' +
        elems.map((e) => '<button class="chip" data-act="central" data-id="' + e + '" aria-pressed="' + (S.solver.central === e) + '"><span class="sym">' + e + '</span></button>').join('') + '</div></div>';
    }
    if (!sol.ok) return h + '<div class="msg err">' + sol.error + '</div>';
    const cCount = pi.toks.filter((t) => t[0] === sol.central).reduce((a, t) => a + t[1], 0);
    if (cCount > 1 && sol.atoms.length > 2) {
      const hasH = pi.toks.some((t) => t[0] === 'H');
      h += '<div class="msg ' + (hasH ? 'err' : 'info') + '">' + (hasH ? 'این فرمول احتمالاً چند اتم مرکزی (زنجیره) دارد؛ این نسخه فقط یک اتم مرکزی را رسم می‌کند و نتیجه ممکن است درست نباشد.' : 'اگر اتصال اتم‌ها در ترکیب شما فرق دارد، اتم مرکزی دیگری را از چیپ‌های بالا انتخاب کن.') + '</div>';
    }
    h += '<div class="card"><div class="row spread" style="margin-bottom:4px"><span class="big" style="font-size:24px">' + E.formulaHTML(cmp.f, cmp.c) + '</span><span class="muted small">' + fa(sol.total) + ' الکترون ظرفیت</span></div>' +
      '<div class="canvas dots-bg">' + lewisSVG(sol, sol.final, { showFC: S.set.fc, scale: 0.95 }) + '</div>' +
      '<div class="row" style="margin-top:8px"><span class="chip">' + sol.geometry + '</span>' + (sol.resonance.length > 1 ? '<span class="chip">' + fa(sol.resonance.length) + ' شکل رزونانسی</span>' : '') + '</div></div>' +
      '<button class="btn primary block" data-act="openCustom">مشاهده‌ی مراحل رسم</button>';
    return h;
  }
  VIEWS.solver = () => {
    const chs = [-3, -2, -1, 0, 1, 2, 3];
    return {
      title: 'ساخت از روی فرمول', subtitle: 'یک اتم مرکزی',
      html: '<div class="field"><label for="sv-in">فرمول شیمیایی</label><input id="sv-in" class="text-in" value="' + esc(S.solver.text) + '" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="SO2Cl2"></div>' +
        '<div class="field"><label>بار کلی</label><div class="row" id="sv-ch">' + chs.map((c) => '<button class="chip num" data-act="charge" data-id="' + c + '" aria-pressed="' + (S.solver.charge === c) + '" dir="ltr">' + (c > 0 ? '+' + c : c < 0 ? '−' + (-c) : '0') + '</button>').join('') + '</div></div>' +
        '<div class="row"><span class="muted small">نمونه:</span>' + ['CO2', 'NH4+', 'NO3-', 'SO2Cl2', 'XeF4', 'ClF3'].map((x) => '<button class="chip" data-act="example" data-id="' + x + '" dir="ltr">' + x + '</button>').join('') + '</div>' +
        '<div id="sv-out" style="display:flex;flex-direction:column;gap:12px">' + solverPreview() + '</div>' +
        '<p class="small muted">این بخش ترکیب‌هایی را رسم می‌کند که یک اتم مرکزی دارند (مثل SO₄²⁻). ترکیب‌های زنجیره‌ای مثل H₂O₂ یا HNO₃ پشتیبانی نمی‌شوند. اگر اتم مرکزی را خودکار اشتباه تشخیص داد، از چیپ‌ها انتخابش کن.</p>'
    };
  };

  /* practice (interactive builder) */
  function startPractice(cmp) {
    const sol = solveCmp(cmp, 'min');
    if (!sol.ok) return null;
    const st = { order: sol.atoms.slice(1).map(() => 1), lp: sol.atoms.map(() => 0) };
    return { cmp, sol, st, hint: 0, msg: null, solved: false, accepted: E.acceptedSigs(cmp.toks, cmp.c, cmp.central) };
  }
  function randomLib(excludeId) {
    const pool = E.LIB.filter((x) => x.id !== excludeId);
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function practiceStatus() {
    const p = S.pr, sol = p.sol, info = E.analyze(sol, p.st);
    const used = E.usedElectrons(p.st);
    return { info, used, left: sol.total - used, rings: info.map((r, i) => (octetOk(r, 0, i) ? 'good' : null)) };
  }
  function practiceCanvas() {
    const p = S.pr, s = practiceStatus();
    return lewisSVG(p.sol, p.st, { showFC: S.set.fc && (p.checked || s.left === 0), interactive: true, rings: p.checked ? s.info.map((r, i) => (octetOk(r, 0, i) ? 'good' : 'bad')) : s.rings, scale: 1.05 });
  }
  function practiceBar() {
    const p = S.pr, s = practiceStatus(), pct = Math.min(100, Math.round((s.used / p.sol.total) * 100));
    return '<div class="counter"><div class="progress"><i style="width:' + pct + '%"></i></div><span class="small num" style="white-space:nowrap">' + fa(s.used) + ' از ' + fa(p.sol.total) + ' الکترون' + '</span></div>' +
      '<p class="small muted" style="margin:6px 0 0">' + (s.left > 0 ? fa(s.left) + ' الکترون (' + fa(s.left / 2) + ' جفت) هنوز جایی نرفته است.' : s.left < 0 ? fa(-s.left) + ' الکترون بیشتر از مجاز گذاشته‌ای.' : 'همه‌ی الکترون‌ها جایگذاری شده‌اند.') + '</p>';
  }
  function practiceMsg() {
    const m = S.pr.msg; if (!m) return '';
    return '<div class="msg ' + m.k + '" role="status">' + m.t + '</div>';
  }
  function practiceControls() {
    const p = S.pr;
    return '<div class="row nowrap"><button class="btn primary grow" data-act="pcheck">بررسی</button><button class="btn grow" data-act="phint">راهنمایی</button></div>' +
      '<div class="row nowrap"><button class="btn ghost grow" data-act="preset">پاک‌کردن</button><button class="btn ghost grow" data-act="panswer">نمایش پاسخ</button>' +
      '<button class="btn ghost grow" data-act="pnext">' + (p.solved ? 'ترکیب بعدی' : 'رد کردن') + '</button></div>';
  }
  VIEWS.practice = () => {
    if (!S.pr) S.pr = startPractice(cmpOf(randomLib()));
    const p = S.pr;
    return {
      title: 'تمرین تعاملی', subtitle: 'حل‌شده: ' + fa(S.stats.solved),
      html: '<div class="card"><div class="row spread"><div><span class="muted small">ساختار لوویس این ذره را کامل کن</span><div class="big" style="font-size:28px;line-height:1.3">' + E.formulaHTML(p.cmp.f, p.cmp.c) + ' <span class="muted small" style="font-weight:500">' + p.cmp.fa + '</span></div></div></div>' +
        '<div class="row" style="margin-top:8px"><select id="pr-sel" class="chip" style="min-height:40px;max-width:100%" aria-label="انتخاب ترکیب">' + E.LIB.map((x) => '<option value="' + x.id + '"' + (p.cmp.id === x.id ? ' selected' : '') + '>' + x.f + (x.c ? (x.c > 0 ? '⁺' : '⁻') : '') + ' — ' + x.fa + '</option>').join('') + '</select></div></div>' +
        '<div class="canvas dots-bg" id="pr-canvas">' + practiceCanvas() + '</div>' +
        '<div class="note small">روی <b>اتم</b> بزن تا جفت ناپیوندی اضافه شود (۰ تا ۴). روی <b>پیوند</b> بزن تا یگانه ← دوگانه ← سه‌گانه شود. شمارنده‌ی زیر نشان می‌دهد چند الکترون مانده است.</div>' +
        '<div class="card flat" id="pr-bar">' + practiceBar() + '</div>' +
        '<div id="pr-msg">' + practiceMsg() + '</div>' + practiceControls()
    };
  };
  function refreshPractice() {
    if (!$('#pr-canvas')) return;
    $('#pr-canvas').innerHTML = practiceCanvas();
    $('#pr-bar').innerHTML = practiceBar();
    $('#pr-msg').innerHTML = practiceMsg();
    $('#pr-sel').value = S.pr.cmp.id || '';
    const act = $('[data-act="pnext"]'); if (act) act.textContent = S.pr.solved ? 'ترکیب بعدی' : 'رد کردن';
  }
  function practiceCheck() {
    const p = S.pr, sol = p.sol, info = E.analyze(sol, p.st), used = E.usedElectrons(p.st);
    p.checked = true;
    const sg = E.sig(p.st);
    if (used !== sol.total) {
      p.msg = { k: 'err', t: used < sol.total ? 'هنوز ' + fa(sol.total - used) + ' الکترون جایگذاری نشده. مجموع باید ' + fa(sol.total) + ' باشد.' : fa(used - sol.total) + ' الکترون بیشتر از مجموع ' + fa(sol.total) + ' گذاشته‌ای.' };
      return;
    }
    const bad = info.map((r, i) => ({ r, i })).filter((x) => !octetOk(x.r, 0, x.i));
    if (bad.length) {
      p.msg = { k: 'err', t: 'اتم‌های ' + bad.map((x) => '<span class="sym">' + x.r.el + '</span>').join('، ') + ' هشتایی (یا برای H دوتایی) نشده‌اند. دایره‌های قرمز را ببین.' };
      return;
    }
    if (p.accepted.has(sg)) {
      p.solved = true;
      if (!p.countedFor || p.countedFor !== p.cmp.f + p.cmp.c) { S.stats.solved += 1; store.set('stats', S.stats); p.countedFor = p.cmp.f + p.cmp.c; }
      const mode = p.accepted.get(sg);
      p.msg = { k: 'ok', t: 'درست است! ' + (mode === 'octet' ? 'این ساختار با قاعده‌ی هشتایی سخت‌گیرانه رسم شده.' : 'این ساختار کمینه‌ی بار رسمی را دارد.') };
      return;
    }
    const fcs = info.filter((r) => r.fc !== 0);
    p.msg = { k: 'err', t: 'الکترون‌ها و هشتایی‌ها درست‌اند، اما این ساختار با پاسخ‌ها یکی نیست. بار رسمی اتم‌ها را حساب کن: ' + (fcs.length ? fcs.map((r) => '<span class="sym">' + r.el + '</span> ' + faSigned(r.fc)).join('، ') : 'همه صفرند') + '. جای پیوندهای چندگانه یا جفت‌های ناپیوندی را عوض کن.' };
  }
  function practiceHint() {
    const p = S.pr, sol = p.sol; p.hint = (p.hint % 3) + 1;

  /* quiz */
  function makeQuestion() {
    const pool = E.LIB.filter((x) => x.f !== 'HCl');
    const lib = pool[Math.floor(Math.random() * pool.length)];
    const sol = solveCmp(cmpOf(lib), 'min');
    const f = E.formulaHTML(lib.f, lib.c);
    const types = ['elec', 'lp', 'bond', 'fc', 'shape'];
    if (new Set(sol.atoms.map((a) => a.el)).size > 1) types.push('central');
    const t = types[Math.floor(Math.random() * types.length)];
    const uniq = (arr) => [...new Set(arr)];
    const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    let q, ans, opts, why;
    if (t === 'elec') {
      q = 'مجموع الکترون‌های ظرفیت ' + f + ' چند است؟'; ans = sol.total;
      opts = uniq([ans, ans + 2, ans - 2, ans + 4, ans - 4, ans + 6].filter((x) => x > 0)).slice(0, 4);
      if (opts.indexOf(ans) < 0) opts[0] = ans;
      why = 'ظرفیت اتم‌ها را جمع کن' + (lib.c ? ' و بار را اعمال کن (' + faSigned(lib.c) + ')' : '') + ': ' + fa(ans) + ' الکترون.';
    } else if (t === 'lp') {
      q = 'اتم مرکزی (<span class="sym">' + sol.central + '</span>) در ساختار لوویس ' + f + ' چند جفت ناپیوندی دارد؟'; ans = sol.final.lp[0];
      opts = [0, 1, 2, 3].filter((x) => x !== ans); opts = shuffle(opts).slice(0, 3).concat(ans);
      why = 'پس از جایگذاری و کاهش بار رسمی، اتم مرکزی ' + fa(ans) + ' جفت ناپیوندی دارد.';
    } else if (t === 'bond') {
      q = 'در ساختار لوویس ' + f + '، مجموع پیوندهای کووالانسی (هر پیوند چندگانه چند تا حساب شود) چند است؟'; ans = sumOrd(sol.final);
      opts = uniq([ans, ans + 1, ans - 1, ans + 2].filter((x) => x > 0)).slice(0, 4);
      why = 'یگانه ۱، دوگانه ۲ و سه‌گانه ۳ حساب می‌شود: مجموع ' + fa(ans) + '.';
    } else if (t === 'fc') {
      const worst = sol.info[0]; q = 'بار رسمی اتم مرکزی (<span class="sym">' + sol.central + '</span>) در ' + f + ' چند است؟'; ans = worst.fc;
      opts = [-2, -1, 0, 1, 2].filter((x) => x !== ans); opts = shuffle(opts).slice(0, 3).concat(ans);
      why = 'ظرفیت (' + fa(worst.v) + ') − ناپیوندی (' + fa(worst.lp * 2) + ') − پیوندها (' + fa(worst.bonds) + ') = ' + faSigned(ans) + '.';
    } else if (t === 'shape') {
      q = 'شکل هندسی ' + f + ' کدام است؟'; ans = sol.geometry;
      opts = shuffle(['خطی', 'خمیده (V شکل)', 'مثلثی مسطح', 'هرمی با قاعده‌ی مثلثی', 'چهاروجهی'].filter((x) => x !== ans)).slice(0, 3).concat(ans);
      why = 'با شمارش جفت‌های پیوندی و ناپیوندی اتم مرکزی (VSEPR): ' + ans + '.';
    } else {
      q = 'اتم مرکزی در ' + f + ' کدام است؟'; ans = sol.central;
      const els = uniq(sol.atoms.map((a) => a.el));
      const extra = shuffle(['C', 'N', 'O', 'S', 'P', 'Cl', 'F', 'Si'].filter((x) => els.indexOf(x) < 0));
      opts = els.concat(extra).slice(0, 4);
      if (opts.indexOf(ans) < 0) opts[0] = ans;
      why = 'کم‌الکترونگاتیوترین اتم (غیر از هیدروژن) مرکزی است: ' + ans + '.';
    }
    opts = shuffle(opts.slice());
    return { q, ans, opts, why, isSym: t === 'central' };
  }

    const [c, a] = ionicPair(), r = CE.ionicBuild(c, a);

  };

  QGEN.bal = () => {
    const pool = BE.LIBR.filter((r) => { const a = BE.analyzeEquation(r.eq); return a.ok && a.ints && a.ints.length <= 7 && Math.max.apply(null, a.ints) <= 12; });
    const r = pick(pool), a = BE.analyzeEquation(r.eq), ints = a.ints;
    const seqKey = (arr) => arr.join(',');
    const seqOpt = (arr) => ({ k: seqKey(arr), h: '<span dir="ltr" class="num">' + arr.map((x) => cfa(x)).join(' ، ') + '</span>' });
    const eqH = rawEqHTML(r.eq);
    if (Math.random() < 0.6) {
      const wr = [];
      ints.forEach((v, i) => { [-1, 1].forEach((d) => { if (v + d >= 1) { const c = ints.slice(); c[i] = v + d; wr.push(seqOpt(c)); } }); });
      if (ints.some((x) => x > 1)) wr.push(seqOpt(ints.map(() => 1)));
      if (Math.max.apply(null, ints) <= 6) wr.push(seqOpt(ints.map((x) => x * 2)));
      wr.push(seqOpt(ints.slice().reverse()));

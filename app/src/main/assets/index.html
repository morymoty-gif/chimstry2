    }
    const j = Math.floor(Math.random() * a.species.length), v = ints[j];
    const co = (x) => ({ k: String(x), h: cfa(x) });
    return { q: 'در معادله‌ی «' + r.fa + '» پس از موازنه، ضریب <span class="formula">' + BE.fmtSpecies(a.species[j].f) + '</span> چند است؟' + eqH, opts: mkOpts(co(v), [v + 1, v + 2, Math.max(1, v - 1), v * 2, 1].filter((x) => x !== v).map(co), [co(3), co(4)]), ans: String(v), why: 'ضرایب موازنه‌شده: ' + ints.map((x) => fa(x)).join(' ، ') + ' ← ضریب این ماده ' + fa(v) + ' است.' };
  };
  const QINFO = {
    bal: ['آزمون موازنه', 'ضرایب واکنش‌های مهم دهم را با روش وارسی پیدا کن.'],
    mm: ['آزمون جرم مولی', 'جرم مولی، جرم n مول و تبدیل جرم به مول؛ از ترکیب‌های سه پایه.'],

    ion: ['آزمون یون‌ها', 'نام و نماد یون‌ها، بار، فلزهای با بار متغیر و عدد اکسایش فلزهای واسطه.'],
    game: ['آزمون جدول بازی', 'پر کردن خانه‌ی جدول (کاتیون × آنیون) و تشخیص یون‌های سازنده.']
  };
  function cqHTML(st) {
    const z = S.cs.quiz[st], best = S.cs.best[st] || 0, info = QINFO[st];

      (a != null ? '<div class="msg ' + (ok ? 'ok' : 'err') + '" role="status">' + (ok ? 'درست! ' : 'نادرست. ') + q.why + '</div><button class="btn primary block" data-act="cqnext" data-st="' + st + '">' + (z.i === 9 ? 'مشاهده‌ی نتیجه' : 'سؤال بعد') + '</button>' : '');

  const firstTab = (st) => ({ bal: 'tool', mm: 'learn', fw: 'ionic', nm: 'ionic', ox: 'metal', ion: 'mono', game: 'table', pol: 'learn' }[st] || FIRST_TAB[st] || 'learn');

  /* ================= stage: molar mass ================= */

  }
  function mmCalcOut() {
    const m = S.cs.mm, f = String(m.calc || '').replace(/\s+/g, '');

      else { const n = v / M; body = '<p>مول = جرم ÷ جرم مولی = ' + fnum(v) + ' ÷ ' + fnum(M) + ' = <b>' + fnum(n) + ' mol</b></p><p>تعداد ذره‌ها = ' + fnum(n) + ' × ۶٫۰۲×۱۰²³ = ' + sci(n * CE.AVOGADRO) + '</p>'; }
      out += '<div class="card"><h2>تبدیل جرم و مول</h2>' + body + '<p class="small muted" style="margin:0">اگر ماده گاز و در شرایط STP باشد، هر مول آن ۲۲٫۴ لیتر حجم دارد.</p></div>';
    }
    return out;
  }
  VIEWS.mm = () => {
    const m = S.cs.mm; let body;
    if (m.tab === 'learn') {
      const list = GRADES[m.grade];
      const els = []; list.forEach((f) => { const r = CE.molarMass(f); r.rows.forEach((x) => { if (els.indexOf(x.el) < 0) els.push(x.el); }); });
      const sel = m.sel && list.indexOf(m.sel) >= 0 ? m.sel : null;
      body = '<div class="seg" role="group" aria-label="پایه">' + [10, 11, 12].map((g) => '<button data-act="mmgrade" data-id="' + g + '" aria-pressed="' + (m.grade === g) + '">پایه‌ی ' + ['دهم', 'یازدهم', 'دوازدهم'][g - 10] + '</button>').join('') + '</div>' +
        '<div class="card flat"><p class="small muted" style="margin:0">جرم مولی (g/mol) = مجموع (جرم اتمی × تعداد اتم) در یک مول ترکیب. روی هر ترکیب بزن تا محاسبه را ببینی. جرم‌های اتمی همان مقدارهای رایج کتاب درسی‌اند (مثلاً Cl = ۳۵٫۵ و Cu = ۶۴). دسته‌بندی بر پایه‌ی موضوع‌های رایج هر پایه است.</p></div>' +
        (sel ? '<div class="card"><h2>' + CF(sel) + ' · ' + FNAME[sel] + '</h2>' + mmDetail(sel) + '</div>' : '') +
        '<div class="mm-list">' + list.map((f) => '<button class="mm-row' + (sel === f ? ' on' : '') + '" data-act="mmsel" data-id="' + esc(f) + '"><span class="n">' + FNAME[f] + '</span><span class="f">' + CF(f) + '</span><span class="v num">' + fnum(mmOf(f)) + '</span></button>').join('') + '</div>' +
        '<div class="card"><h2>جرم اتمی عنصرهای این فهرست</h2><div class="row">' + els.map((e) => '<span class="chip" style="cursor:default"><span class="sym">' + e + '</span>&nbsp;' + fnum(CE.MASS[e][0]) + '</span>').join('') + '</div></div>';
    } else if (m.tab === 'calc') {

        exChips('mm', 'calc', ['H2SO4', 'Ca3(PO4)2', 'Al2(SO4)3', 'CuSO4·5H2O', 'C6H12O6']) +
        '<div class="seg" role="group"><button data-act="mmmode" data-id="m2g" aria-pressed="' + (m.mode === 'm2g') + '">مول ← گرم</button><button data-act="mmmode" data-id="g2m" aria-pressed="' + (m.mode === 'g2m') + '">گرم ← مول</button></div>' +
        '<div class="field"><label for="mm-amt">' + (m.mode === 'm2g' ? 'مقدار (مول)' : 'مقدار (گرم)') + '</label><input id="mm-amt" class="text-in sm" inputmode="decimal" value="' + esc(m.amt) + '" autocomplete="off"></div>' +
        '<div id="cs-out" style="display:flex;flex-direction:column;gap:12px">' + mmCalcOut() + '</div>';
    } else body = cqHTML('mm');
    return { title: 'جرم مولی ترکیبات', subtitle: 'پایه‌ی دهم · یازدهم · دوازدهم', back: true, html: csTabs('mm', [['learn', 'جدول ترکیب‌ها'], ['calc', 'محاسبه'], ['quiz', 'آزمون']]) + body };
  };

  /* ================= stage: formula writing ================= */
  const ionOptGroups = (cur, sign) => {
    const list = CE.IONS.filter((i) => (sign > 0 ? i.c > 0 : i.c < 0));
    const g = (name, arr) => '<optgroup label="' + name + '">' + optList(arr.map((i) => [i.id, i.fa + ' — ' + CE.ionPlain(i)]), cur) + '</optgroup>';
    return g('تک‌اتمی', list.filter((i) => !i.poly)) + g('چنداتمی', list.filter((i) => i.poly));
  };
  const NM_EL = CE.ORDER.filter((e) => e !== 'Xe');
  function covBuilderOut(ea, na, eb, nb) {
    const f = ea + (na > 1 ? na : '') + eb + (nb > 1 ? nb : '');
    const r = CE.covName(f);
    if (!r.ok) return '<div class="msg err">' + r.error + '</div>';
    const known = CE.COV_LIST.some((x) => x[0] === r.formula) || r.a === 'H';
    const st = [
      'عنصری که الکترونگاتیوی کمتر دارد اول نوشته می‌شود؛ ترتیب: ' + mono(r.a) + ' سپس ' + mono(r.b) + '.',
      'پیشوندها شمار اتم‌ها را نشان می‌دهند: ' + mono(r.a) + ' → ' + fa(r.na) + (r.na === 1 ? ' (پیشوند ندارد)' : ' («' + CE.PREFIX_PLAIN[r.na] + '»)') + ' ؛ ' + mono(r.b) + ' → ' + fa(r.nb) + ' («' + CE.PREFIX_PLAIN[r.nb] + '»).',
      'فرمول مولکولی: ' + CF(r.formula) + ' (زیروند = تعداد اتم هر عنصر).',
      'نام: <b>' + r.name + '</b>'
    ];
    return '<div class="card"><div style="text-align:center;font-size:26px;margin-bottom:8px">' + CF(r.formula) + '<div style="font-weight:800;font-size:19px;margin-top:4px">' + r.name + '</div></div>' + stepsHTML(st) + (known ? '' : '<p class="small muted" style="margin:10px 0 0">توجه: این فرمول فقط برای تمرین قاعده‌ی پیشوندهاست و لزوماً ترکیبی شناخته‌شده نیست.</p>') + '</div>';
  }
  VIEWS.fw = () => {
    const w = S.cs.fw; let body;
    if (w.tab === 'ionic') {
      const c = nameOfIon(w.c) || nameOfIon('Na+1'), a = nameOfIon(w.a) || nameOfIon('Cl-1');
      body = '<div class="card flat"><p class="small muted" style="margin:0">کاتیون و آنیون را انتخاب کن. فرمول یونی با روش ضربدری و ساده‌سازی نوشته می‌شود.</p></div>' +
        '<div class="grid2" style="gap:10px"><div class="field"><label for="fw-c">کاتیون (+)</label><select class="sel" id="fw-c">' + ionOptGroups(w.c, 1) + '</select></div><div class="field"><label for="fw-a">آنیون (−)</label><select class="sel" id="fw-a">' + ionOptGroups(w.a, -1) + '</select></div></div>' +
        '<div id="cs-out" style="display:flex;flex-direction:column;gap:12px">' + ionCard(c, a) + '</div>' +
        '<div class="card"><h2>قاعده‌ها</h2><ul class="guide-list small"><li>مجموع بارهای مثبت و منفی باید صفر شود.</li><li>روش ضربدری: عدد بار هر یون زیروند یون دیگر است، سپس ساده می‌شود (مثلاً Mg²⁺ و O²⁻ ← MgO و نه Mg₂O₂).</li><li>زیروند ۱ نوشته نمی‌شود.</li><li>برای یون چنداتمی با زیروند بیشتر از ۱ پرانتز می‌گذاریم: Ca(OH)₂ و (NH₄)₂SO₄.</li><li>اول کاتیون، بعد آنیون نوشته می‌شود.</li></ul></div>';
    } else if (w.tab === 'cov') {
      const els = NM_EL.map((e) => [e, e + ' — ' + CE.FA_EL[e]]);
      body = '<div class="card flat"><p class="small muted" style="margin:0">ترکیب مولکولی از دو نافلز ساخته می‌شود. عنصرها و تعداد اتم‌ها را انتخاب کن.</p></div>' +
        '<div class="grid2" style="gap:10px"><div class="field"><label for="fw-ea">عنصر اول</label>' + sel('fw-ea', els, w.ea) + '</div><div class="field"><label for="fw-na">تعداد</label>' + sel('fw-na', rangeOpts(10), w.na) + '</div><div class="field"><label for="fw-eb">عنصر دوم</label>' + sel('fw-eb', els, w.eb) + '</div><div class="field"><label for="fw-nb">تعداد</label>' + sel('fw-nb', rangeOpts(10), w.nb) + '</div></div>' +
        (w.ea === w.eb ? '<div class="msg err">دو عنصر باید متفاوت باشند.</div>' : '<div id="cs-out" style="display:flex;flex-direction:column;gap:12px">' + covBuilderOut(w.ea, w.na, w.eb, w.nb) + '</div>') +
        '<div class="card"><h2>پیشوندها</h2><div class="table-wrap"><table><tbody><tr>' + [1, 2, 3, 4, 5].map((i) => '<td class="num">' + fa(i) + '</td>').join('') + '</tr><tr>' + [1, 2, 3, 4, 5].map((i) => '<td>' + CE.PREFIX_PLAIN[i] + '</td>').join('') + '</tr><tr>' + [6, 7, 8, 9, 10].map((i) => '<td class="num">' + fa(i) + '</td>').join('') + '</tr><tr>' + [6, 7, 8, 9, 10].map((i) => '<td>' + CE.PREFIX_PLAIN[i] + '</td>').join('') + '</tr></tbody></table></div></div>';

  };

  /* ================= stage: naming ================= */
  VIEWS.nm = () => {
    const n = S.cs.nm; let body;
    if (n.tab === 'ionic') {
      body = '<div class="field"><label for="nm-i1">فرمول ترکیب یونی</label><input id="nm-i1" class="text-in sm" value="' + esc(n.i1) + '" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="Fe2(SO4)3"></div>' +
        exChips('nm', 'i1', ['NaCl', 'Fe2O3', 'CuSO4', 'Ca(OH)2', '(NH4)3PO4', 'KMnO4', 'FeCl2', 'Al2(SO4)3']) +
        '<div id="cs-out" style="display:flex;flex-direction:column;gap:12px">' + nameCard(CE.nameAny(n.i1)) + '</div>' +
        '<div class="card"><h2>قاعده‌های نام‌گذاری</h2><ul class="guide-list small"><li>اول نام کاتیون، بعد نام آنیون: «سدیم کلرید».</li><li>آنیون تک‌اتمی: ریشه‌ی نافلز + «ید» (کلر ← کلرید، اکسیژن ← اکسید، گوگرد ← سولفید).</li><li>فلزهای با بار متغیر (آهن، مس، سرب، قلع...): بار فلز با عدد رومی در پرانتز: آهن (II) و آهن (III).</li><li>فلزهای گروه ۱، ۲ و آلومینیم، روی و نقره بار ثابت دارند و عدد رومی نمی‌خواهند.</li><li>آنیون‌های اکسیژن‌دار: بیشتر اکسیژن «ات» (نیترات NO₃⁻)، کمتر اکسیژن «یت» (نیتریت NO₂⁻).</li></ul></div>' +
        '<div class="card"><h2>خانواده‌ی کلر و اکسیژن</h2><div class="table-wrap"><table><thead><tr><th>یون</th><th>نام</th><th>قاعده</th></tr></thead><tbody>' + [['ClO-1', 'کمترین اکسیژن'], ['ClO2-1', 'کمتر'], ['ClO3-1', 'بیشتر'], ['ClO4-1', 'بیشترین اکسیژن']].map((x) => { const i = nameOfIon(x[0]); return '<tr><td>' + ionH(i) + '</td><td>' + i.fa + '</td><td class="small muted">' + x[1] + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    } else if (n.tab === 'cov') {
      body = '<div class="field"><label for="nm-i2">فرمول ترکیب مولکولی</label><input id="nm-i2" class="text-in sm" value="' + esc(n.i2) + '" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="N2O5"></div>' +
        exChips('nm', 'i2', ['CO2', 'N2O4', 'PCl5', 'SF6', 'CCl4', 'SO3', 'HCl', 'NF3']) +
        '<div id="cs-out" style="display:flex;flex-direction:column;gap:12px">' + nameCard(CE.nameAny(n.i2)) + '</div>' +
        '<div class="card"><h2>قاعده‌های نام‌گذاری</h2><ul class="guide-list small"><li>ترتیب نام همان ترتیب فرمول است (عنصر کم‌الکترونگاتیوتر اول).</li><li>پیشوند تعداد: مونو ۱، دی ۲، تری ۳، تترا ۴، پنتا ۵، هگزا ۶، هپتا ۷، اکتا ۸، نونا ۹، دکا ۱۰.</li><li>برای عنصر اول، اگر یک اتم باشد پیشوند «مونو» نمی‌آید (کربن مونوکسید).</li><li>عنصر دوم با پایه‌ی «ید» می‌آید: کلرید، اکسید، سولفید، فلوئورید.</li><li>برخی ترکیب‌ها نام رایج دارند: H₂O آب، NH₃ آمونیاک، CH₄ متان.</li></ul></div>' +
        '<div class="card"><h2>ترکیب‌های آشنا</h2><div class="table-wrap"><table><tbody>' + CE.COV_LIST.filter((x) => !x[2] && x[0] !== 'H2O').slice(0, 18).map((x) => '<tr><td>' + CF(x[0]) + '</td><td>' + x[1] + '</td></tr>').join('') + '</tbody></table></div></div>';
    } else body = cqHTML('nm');
    return { title: 'نام‌گذاری ترکیبات', subtitle: 'یونی و مولکولی', back: true, html: csTabs('nm', [['ionic', 'یونی'], ['cov', 'مولکولی'], ['quiz', 'آزمون']]) + body };
  };

  /* ================= stage: oxides ================= */
  const METAL_LIST = ['Li', 'Na', 'K', 'Be', 'Mg', 'Ca', 'Sr', 'Ba', 'Al', 'Zn', 'Ag', 'Cu', 'Fe', 'Pb', 'Sn', 'Mn', 'Cr', 'Ni', 'Co', 'Hg'];
  const chargesOf = (el) => CE.IONS.filter((i) => i.kind === 'mono' && i.c > 0 && i.f === el).map((i) => i.c);
  const behChip = (f) => SAFE_BEHAV[f] ? '<span class="tag">' + SAFE_BEHAV[f] + '</span>' : '<span class="muted">—</span>';
  VIEWS.ox = () => {
    const o = S.cs.ox; let body;
    if (o.tab === 'metal') {
      const chs = chargesOf(o.mel); if (chs.indexOf(+o.mch) < 0) o.mch = chs[0];
      const cat = CE.IONS.find((i) => i.f === o.mel && i.c === +o.mch && i.kind === 'mono');
      body = '<div class="card flat"><p class="small muted" style="margin:0">اکسید فلزی ترکیب یونی فلز با یون اکسید (O²⁻) است و رفتار بازی دارد (اکسیدهای آمفوتر استثنا هستند). فلزهای بار متغیر عدد رومی می‌گیرند.</p></div>' +
        '<div class="card"><h2>ساخت اکسید فلز</h2><div class="grid2" style="gap:10px"><div class="field"><label for="ox-mel">فلز</label>' + sel('ox-mel', METAL_LIST.map((e) => [e, e + ' — ' + CE.FA_EL[e]]), o.mel) + '</div><div class="field"><label for="ox-mch">بار فلز</label>' + sel('ox-mch', chs.map((c) => [c, fa(c) + '+']), o.mch) + '</div></div></div>' +
        '<div style="display:flex;flex-direction:column;gap:12px">' + ionCard(cat, nameOfIon('O-2'), 'گام‌به‌گام') + '</div>' +
        '<div class="field"><label for="ox-i1">نام‌گذاری از روی فرمول</label><input id="ox-i1" class="text-in sm" value="' + esc(o.i1) + '" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="Fe2O3"></div>' +
        exChips('ox', 'i1', ['Na2O', 'FeO', 'Fe2O3', 'Cu2O', 'Al2O3', 'PbO2']) +
        '<div id="cs-out" style="display:flex;flex-direction:column;gap:12px">' + nameCard(CE.nameAny(o.i1)) + '</div>' +
        '<div class="card"><h2>جدول اکسیدهای فلزی</h2><div class="table-wrap"><table><thead><tr><th>فرمول</th><th>نام</th><th>رفتار</th></tr></thead><tbody>' + CE.METAL_OXIDES.map((f) => '<tr><td>' + CF(f) + '</td><td>' + CE.oxideName(f).name + '</td><td>' + behChip(f) + '</td></tr>').join('') + '</tbody></table></div></div>';
    } else if (o.tab === 'non') {
      const els = ['C', 'N', 'S', 'P', 'Cl', 'Si'].map((e) => [e, e + ' — ' + CE.FA_EL[e]]);
      body = '<div class="card flat"><p class="small muted" style="margin:0">اکسید نافلزی مولکولی است و با پیشوند نام‌گذاری می‌شود. بیشتر آن‌ها اسیدی‌اند؛ CO و NO و N₂O خنثی هستند.</p></div>' +
        '<div class="card"><h2>ساخت اکسید نافلز</h2><div class="grid2" style="gap:10px"><div class="field"><label for="ox-nel">نافلز</label>' + sel('ox-nel', els, o.nel) + '</div><div class="field"><label for="ox-nn">تعداد اتم نافلز</label>' + sel('ox-nn', rangeOpts(10), o.nn) + '</div><div class="field"><label for="ox-no">تعداد اتم اکسیژن</label>' + sel('ox-no', rangeOpts(10), o.no) + '</div></div></div>' +
        '<div style="display:flex;flex-direction:column;gap:12px">' + nameCard(CE.nameAny(o.nel + (o.nn > 1 ? o.nn : '') + 'O' + (o.no > 1 ? o.no : ''))) + '</div>' +
        '<div class="field"><label for="ox-i2">نام‌گذاری از روی فرمول</label><input id="ox-i2" class="text-in sm" value="' + esc(o.i2) + '" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="SO3"></div>' +
        exChips('ox', 'i2', ['CO', 'CO2', 'NO2', 'N2O4', 'SO3', 'P4O10']) +
        '<div id="cs-out" style="display:flex;flex-direction:column;gap:12px">' + nameCard(CE.nameAny(o.i2)) + '</div>' +
        '<div class="card"><h2>جدول اکسیدهای نافلزی</h2><div class="table-wrap"><table><thead><tr><th>فرمول</th><th>نام</th><th>رفتار</th></tr></thead><tbody>' + CE.NONMETAL_OXIDES.map((f) => '<tr><td>' + CF(f) + '</td><td>' + CE.oxideName(f).name + '</td><td>' + behChip(f) + '</td></tr>').join('') + '</tbody></table></div><p class="small muted" style="margin:8px 0 0">رفتار فقط برای اکسیدهایی نوشته شده که در کتاب‌های درسی رایج‌اند.</p></div>';
    } else body = cqHTML('ox');
    return { title: 'اکسیدها', subtitle: 'فلزی و نافلزی', back: true, html: csTabs('ox', [['metal', 'فلزی'], ['non', 'نافلزی'], ['quiz', 'آزمون']]) + body };
  };

  /* ================= stage: ions ================= */
  function ionCards(list) {
    if (!list.length) return '<div class="empty">یونی پیدا نشد.</div>';
    return '<div class="grid2">' + list.map((i) => '<div class="ion-card"><div class="sy">' + ionH(i) + '</div><b>' + i.fa + '</b>' + (i.grp ? '<span class="small muted">' + i.grp + '</span>' : '') + (i.tip ? '<span class="small muted">' + i.tip + '</span>' : '') + '</div>').join('') + '</div>';
  }
  function ionList() {
    const n = S.cs.ion, q = norm(n.q);
    const match = (i) => !q || norm(i.fa).indexOf(q) >= 0 || norm(i.f).indexOf(q) >= 0 || norm(CE.ionPlain(i)).indexOf(q) >= 0;
    const poly = n.tab === 'poly';
    const L = CE.IONS.filter((i) => i.poly === poly && match(i));
    const sec = (t, a) => a.length ? '<h2 style="font-size:15px;margin:6px 0 2px">' + t + '</h2>' + ionCards(a) : '';
    if (!poly) return sec('کاتیون‌ها با بار ثابت', L.filter((i) => i.c > 0 && !i.variable)) + sec('کاتیون‌ها با بار متغیر', L.filter((i) => i.c > 0 && i.variable)) + sec('آنیون‌ها', L.filter((i) => i.c < 0)) || '<div class="empty">یونی پیدا نشد.</div>';
    return sec('کاتیون‌های چنداتمی', L.filter((i) => i.c > 0)) + sec('آنیون‌های چنداتمی', L.filter((i) => i.c < 0)) || '<div class="empty">یونی پیدا نشد.</div>';
  }
  VIEWS.ion = () => {
    const n = S.cs.ion; let body;
    if (n.tab === 'quiz') body = cqHTML('ion');
    else if (n.tab === 'trans') {
      const card = (m) => {
        const ions = m.ch.map((c) => CE.IONS.find((x) => x.f === m.el && x.c === c && x.kind === 'mono')).filter(Boolean);
        if (m.extra) ions.unshift(nameOfIon(m.extra));
        ions.sort((a, b) => a.c - b.c);
        return '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">' + CE.FA_EL[m.el] + ' <span class="sym">' + m.el + '</span></h2>' + (m.main ? '<span class="tag">غیرواسطه</span>' : '<span class="tag">واسطه</span>') + '</div>' +
          '<div class="trow"><span class="muted small">یون‌های رایج</span><span class="tions">' + ions.map((i) => '<span class="ionp">' + ionH(i) + '<small>' + i.fa + '</small></span>').join('') + '</span></div>' +
          '<div class="trow"><span class="muted small">عدد اکسایش در ترکیب‌ها</span><b class="num" dir="ltr">' + m.ox + '</b></div>' +
          '<div class="trow"><span class="muted small">نمونه‌ها</span><span class="tions">' + m.ex.map((f) => '<span class="chip" style="cursor:default">' + CF(f) + '</span>').join('') + '</span></div>' +
          (m.note ? '<p class="small muted" style="margin:6px 0 0">' + m.note + '</p>' : '') + '</div>';
      };
      body = '<div class="card flat"><p class="small muted" style="margin:0">بیشتر فلزهای واسطه بیش از یک عدد اکسایش (بار) دارند؛ در نام ترکیب، بار با عدد رومی در پرانتز می‌آید: آهن (II) و آهن (III). فلزهای <b>روی (Zn²⁺)</b> و <b>نقره (Ag⁺)</b> بار ثابت دارند.</p></div>' +
        TRANS.map(card).join('');
    } else {
      const rule = n.tab === 'mono'
        ? '<div class="card"><h2>قاعده‌ها</h2><ul class="guide-list small"><li>فلزها الکترون از دست می‌دهند و کاتیون می‌شوند؛ نام کاتیون همان نام فلز است (سدیم Na⁺).</li><li>بار کاتیون گروه ۱ برابر +۱، گروه ۲ برابر +۲ و گروه ۱۳ (Al) برابر +۳ است.</li><li>نافلزها الکترون می‌گیرند و آنیون می‌شوند: گروه ۱۷ ← −۱، گروه ۱۶ ← −۲، گروه ۱۵ ← −۳.</li><li>نام آنیون تک‌اتمی: ریشه‌ی نافلز + «ید» (کلر ← کلرید، گوگرد ← سولفید، اکسیژن ← اکسید).</li><li>فلزهای واسطه و برخی دیگر (Fe، Cu، Pb، Sn...) بار متغیر دارند و در نام با عدد رومی مشخص می‌شوند.</li></ul></div>'
        : '<div class="card"><h2>قاعده‌ها</h2><ul class="guide-list small"><li>یون چنداتمی گروهی از اتم‌هاست که با هم یک بار دارند؛ کل گروه با یک زیروند به پرانتز می‌رود: (NO₃)₂.</li><li>بیشترِ آنیون‌های اکسیژن‌دار با پسوند «ات» یا «یت» نام‌گذاری می‌شوند: بیشتر اکسیژن ← «ات» (سولفات SO₄²⁻)، کمتر ← «یت» (سولفیت SO₃²⁻).</li><li>کلر چهار آنیون دارد: هیپوکلریت ClO⁻، کلریت ClO₂⁻، کلرات ClO₃⁻ و پرکلرات ClO₄⁻.</li><li>تنها کاتیون‌های چنداتمی رایج: آمونیوم NH₄⁺ و هیدرونیوم H₃O⁺.</li><li>نام‌های «هیدروژن‌...» نشان می‌دهند یک H⁺ در یون وجود دارد (HCO₃⁻، HSO₄⁻).</li></ul></div>';
      body = '<label class="search">' + icon('search') + '<input id="ion-q" type="search" placeholder="نام یا نماد؛ مثل سولفات یا NO3" value="' + esc(n.q) + '" autocomplete="off"></label>' +
        '<div id="cs-out" style="display:flex;flex-direction:column;gap:10px">' + ionList() + '</div>' + rule;
    }
    return { title: 'یون‌ها', subtitle: 'تک‌اتمی و چنداتمی', back: true, html: csTabs('ion', [['mono', 'تک‌اتمی'], ['poly', 'چنداتمی'], ['trans', 'واسطه‌ها'], ['quiz', 'آزمون']]) + body };
  };

  /* ================= stage: game table ================= */
  const GT_C = ['Li+1', 'Na+1', 'K+1', 'NH4+1', 'Ag+1', 'Mg+2', 'Ca+2', 'Ba+2', 'Zn+2', 'Cu+1', 'Cu+2', 'Fe+2', 'Fe+3', 'Al+3'];
  const GT_A = ['F-1', 'Cl-1', 'Br-1', 'I-1', 'O-2', 'S-2', 'OH-1', 'NO3-1', 'HCO3-1', 'SO4-2', 'CO3-2', 'PO4-3'];
  const GAME_CFG = {
    easy: { nc: 3, na: 3, cs: ['Na+1', 'K+1', 'Mg+2', 'Ca+2', 'Ba+2', 'Al+3', 'Zn+2', 'Ag+1'], as: ['F-1', 'Cl-1', 'Br-1', 'O-2', 'S-2', 'N-3'] },
    mid: { nc: 3, na: 3, cs: ['Na+1', 'K+1', 'NH4+1', 'Mg+2', 'Ca+2', 'Ba+2', 'Al+3', 'Zn+2', 'Ag+1'], as: ['Cl-1', 'O-2', 'OH-1', 'NO3-1', 'SO4-2', 'CO3-2', 'PO4-3'] },
    hard: { nc: 4, na: 3, cs: ['Na+1', 'NH4+1', 'Mg+2', 'Ca+2', 'Al+3', 'Fe+2', 'Fe+3', 'Cu+1', 'Cu+2'], as: ['Cl-1', 'O-2', 'S-2', 'OH-1', 'NO3-1', 'SO4-2', 'CO3-2', 'PO4-3', 'ClO3-1', 'MnO4-1'] }
  };
  function newRound(diff) {
    const cfg = GAME_CFG[diff];
    for (let t = 0; t < 300; t++) {
      const cs = shuffle(cfg.cs).slice(0, cfg.nc).map(nameOfIon), as = shuffle(cfg.as).slice(0, cfg.na).map(nameOfIon);
      if (diff === 'hard' && new Set(cs.map((c) => c.f)).size === cs.length && Math.random() < 0.7) continue;
      const exp = []; cs.forEach((c) => as.forEach((a) => exp.push(CE.ionicBuild(c, a).f)));
      if (new Set(exp).size !== exp.length) continue;
      return { cs, as, exp, bank: shuffle(exp.map((f, i) => i)), placed: exp.map(() => null), sel: null, checked: false, won: false, nc: cfg.nc, na: cfg.na };
    }
    return null;
  }
  const gtHead = (i) => '<th scope="col">' + ionH(i) + '</th>';
  function gameTableExplorer() {
    const g = S.cs.game;
    const as = GT_A.map(nameOfIon).filter((a) => g.filt === 'all' || (g.filt === 'mono' ? !a.poly : a.poly));
    const cs = GT_C.map(nameOfIon);
    const head = '<tr><th class="corner">کاتیون \\ آنیون</th>' + as.map(gtHead).join('') + '</tr>';
    const rows = cs.map((c) => '<tr><th scope="row">' + ionH(c) + '</th>' + as.map((a) => {
      const f = CE.ionicBuild(c, a).f, on = g.sel === c.id + '|' + a.id;
      return '<td><button class="gcell' + (on ? ' on' : '') + '" data-act="gtcell" data-id="' + c.id + '|' + a.id + '" aria-label="' + c.fa + ' و ' + a.fa + '">' + CF(f) + '</button></td>';
    }).join('') + '</tr>').join('');
    let detail = '<div class="empty">روی یک خانه بزن تا نام و روش ساخت را ببینی.</div>';
    if (g.sel) { const [ci, ai] = g.sel.split('|'); detail = ionCard(nameOfIon(ci), nameOfIon(ai)); }
    return '<div class="seg" role="group"><button data-act="gfilt" data-id="all" aria-pressed="' + (g.filt === 'all') + '">همه‌ی آنیون‌ها</button><button data-act="gfilt" data-id="mono" aria-pressed="' + (g.filt === 'mono') + '">تک‌اتمی</button><button data-act="gfilt" data-id="poly" aria-pressed="' + (g.filt === 'poly') + '">چنداتمی</button></div>' +
      '<div class="table-wrap gt-wrap"><table class="gtable"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>' + detail;
  }
  function gamePlay() {
    const g = S.cs.game;
    if (!g.round) g.round = newRound(g.diff);
    const R = g.round;
    const seg = '<div class="seg" role="group" aria-label="سطح">' + [['easy', 'آسان'], ['mid', 'متوسط'], ['hard', 'سخت']].map((d) => '<button data-act="gdiff" data-id="' + d[0] + '" aria-pressed="' + (g.diff === d[0]) + '">' + d[1] + '</button>').join('') + '</div>';
    const used = new Set(R.placed.filter((x) => x != null));
    const bank = R.bank.map((idx) => used.has(idx) ? '' : '<button class="chip gchip' + (R.sel === idx ? ' on' : '') + '" data-act="gbank" data-id="' + idx + '" aria-pressed="' + (R.sel === idx) + '">' + CF(R.exp[idx]) + '</button>').join('');
    const left = R.bank.length - used.size;
    const head = '<tr><th class="corner"></th>' + R.as.map(gtHead).join('') + '</tr>';
    const rows = R.cs.map((c, i) => '<tr><th scope="row">' + ionH(c) + '</th>' + R.as.map((a, j) => {
      const k = i * R.na + j, p = R.placed[k];
      let cls = 'gcell slot';
      if (p != null) { cls += ' filled'; if (R.checked) cls += (R.exp[p] === R.exp[k] ? ' good' : ' bad'); }
      return '<td><button class="' + cls + '" data-act="gslot" data-id="' + k + '" aria-label="' + c.fa + ' و ' + a.fa + '">' + (p != null ? CF(R.exp[p]) : '＋') + '</button></td>';
    }).join('') + '</tr>').join('');
    let msg = '';
    if (R.won) msg = '<div class="msg ok" role="status">آفرین! همه‌ی خانه‌ها درست است. (' + fa(g.wins) + ' جدول کامل‌شده)</div>';
    else if (R.checked) msg = '<div class="msg err" role="status">خانه‌های قرمز درست نیستند. روی آن‌ها بزن تا فرمول برگردد و دوباره امتحان کن.</div>';
    else msg = '<div class="msg info">یک فرمول از بانک را انتخاب کن، سپس روی خانه‌ی مناسب بزن. فرمول هر خانه از ترکیب کاتیون ردیف و آنیون ستون ساخته می‌شود.</div>';
    return seg + '<div class="card"><div class="table-wrap"><table class="gtable play"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div></div>' +
      '<div class="card"><h2>بانک فرمول‌ها <span class="muted-i">(' + fa(left) + ' مانده)</span></h2><div class="row">' + (bank || '<span class="muted small">همه‌ی فرمول‌ها گذاشته شد. «بررسی» را بزن.</span>') + '</div></div>' + msg +
      '<div class="row nowrap"><button class="btn primary grow" data-act="gcheck"' + (left ? ' disabled' : '') + '>بررسی</button><button class="btn grow" data-act="gshow">نمایش پاسخ</button><button class="btn grow" data-act="gnew">جدول تازه</button></div>';
  }
  VIEWS.game = () => {
    const g = S.cs.game; let body;
    if (g.tab === 'table') body = '<div class="card flat"><p class="small muted" style="margin:0">جدول همه‌ی ترکیب‌های ممکن از هر کاتیون (ردیف) و آنیون (ستون). روی هر خانه بزن تا روش ساخت را ببینی.</p></div>' + gameTableExplorer();
    else if (g.tab === 'play') body = gamePlay();
    else body = cqHTML('game');
    return { title: 'جدول بازی یون‌ها', subtitle: 'کاتیون × آنیون', back: true, html: csTabs('game', [['table', 'جدول'], ['play', 'بازی'], ['quiz', 'آزمون']]) + body };
  };

  /* ================= registration ================= */
  MODULES.push(
    { id: 'mm', title: 'جرم مولی ترکیبات', sub: 'پایه‌ی دهم، یازدهم و دوازدهم', ic: 'mol', go: () => go('mm') },
    { id: 'fw', title: 'فرمول‌نویسی', sub: 'ترکیب‌های یونی و کووالانسی', ic: 'fw', go: () => go('fw') },
    { id: 'nm', title: 'نام‌گذاری ترکیبات', sub: 'یونی و مولکولی', ic: 'nm', go: () => go('nm') },

    return '<svg id="strm" class="strm' + (p.rod ? ' on' : '') + '" viewBox="0 0 340 200" role="img" aria-label="آزمایش جریان مایع و میله‌ی باردار">' +
      '<g class="rod"><rect x="248" y="70" width="70" height="16" rx="8" transform="rotate(-18 283 78)"/><text x="283" y="62" font-size="14" text-anchor="middle">−</text><text x="283" y="62" font-size="0"> </text></g>' +
      '<rect x="42" y="8" width="44" height="12" rx="4" class="nozzle"/><rect x="190" y="8" width="44" height="12" rx="4" class="nozzle"/>' +
      '<path class="s0" d="M64 20 V176"/><path class="s1" d="M64 20 C64 90 88 140 112 176"/>' +
      '<path class="h0" d="M212 20 V176"/>' +
      '<text class="slabel" x="64" y="194" font-size="13">آب (قطبی)</text><text class="slabel" x="212" y="194" font-size="13">هگزان (ناقطبی)</text></svg>';
  }

  /* ---------- views ---------- */
  function polLearn() {
    const hcl = PE.byFormula('HCl'), h2o = PE.byFormula('H2O'), co2 = PE.byFormula('CO2'), ch4 = PE.byFormula('CH4'), nh3 = PE.byFormula('NH3'), bf3 = PE.byFormula('BF3');
    const mini = (m, cap) => '<div class="minip">' + polSVG(m, { maxW: 150, zoom: 0.62 }) + '<b>' + CF(m.f) + '</b><span class="small muted">' + cap + '</span></div>';
    const symRows = [['AX₂ خطی، بدون جفت ناپیوندی', 'CO₂ · BeCl₂', 'ناقطبی'], ['AX₃ مثلثی مسطح', 'BF₃ · SO₃', 'ناقطبی'], ['AX₄ چهاروجهی (اتم‌های یکسان)', 'CH₄ · CCl₄', 'ناقطبی'], ['AX₄ چهاروجهی (اتم‌های متفاوت)', 'CH₃Cl · CHCl₃', 'قطبی'], ['AX₅ دوهرم · AX₆ هشت‌وجهی', 'PCl₅ · SF₆', 'ناقطبی'], ['AX₂E₂ خمیده', 'H₂O · H₂S', 'قطبی'], ['AX₃E هرمی', 'NH₃ · PCl₃', 'قطبی'], ['جفت‌های ناپیوندی متقارن', 'XeF₂ · XeF₄', 'ناقطبی']];
    return '<div class="card"><h2>۱) پیوند قطبی و ناقطبی</h2><p>در پیوند کووالانسی، اگر دو اتم الکترونگاتیوی یکسان داشته باشند (مثل Cl–Cl)، الکترون‌ها را برابر سهیم‌اند و پیوند <b>ناقطبی</b> است. اگر اختلاف الکترونگاتیوی (ΔEN) صفر نباشد، الکترون‌ها به سوی اتم الکترونگاتیوتر کشیده می‌شوند؛ این اتم بار جزئی <b>δ−</b> و اتم دیگر بار جزئی <b>δ+</b> می‌گیرد و پیوند <b>قطبی</b> است.</p><div style="text-align:center">' + polSVG(hcl, { delta: true, maxW: 280 }) + '</div><p class="small muted" style="margin:6px 0 0">در HCl اتم Cl الکترونگاتیوتر است؛ پیکان از δ+ به سمت δ− رسم می‌شود.</p></div>' +
      '<div class="card"><h2>۲) ممان دوقطبی (μ)</h2><p>ممان دوقطبی کمیتی برداری است و اندازه‌ی آن برابر است با <b>بار جزئی × فاصله‌ی دو بار</b>:</p><div class="formula-note" style="text-align:center;direction:ltr">μ = q × d</div><p class="small" style="margin:8px 0 0">یکای آن دبای (D) است: <span dir="ltr" class="num">1 D ≈ 3.34 × 10<sup>−30</sup> C·m</span>. هرچه ΔEN بیشتر باشد، ممان دوقطبی پیوند بزرگ‌تر است. ممان دوقطبی مولکول، <b>جمع برداری</b> ممان‌های دوقطبی همه‌ی پیوندهاست.</p></div>' +
      '<div class="card"><h2>۳) مولکول قطبی و ناقطبی</h2><p>اگر برآیند ممان‌های دوقطبی پیوندها <b>صفر نباشد</b>، مولکول قطبی است؛ اگر صفر شود، مولکول ناقطبی است، حتی وقتی پیوندهایش قطبی باشند.</p><div class="grid2" style="gap:8px">' + mini(h2o, 'قطبی — برآیند صفر نیست') + mini(co2, 'ناقطبی — پیوندها یکدیگر را خنثی می‌کنند') + mini(nh3, 'قطبی') + mini(ch4, 'ناقطبی — متقارن') + '</div></div>' +
      '<div class="card"><h2>۴) نقش تقارن و شکل مولکول</h2><div class="table-wrap"><table><thead><tr><th>آرایش</th><th>نمونه</th><th>مولکول</th></tr></thead><tbody>' + symRows.map((r) => '<tr><td class="small">' + r[0] + '</td><td class="small" dir="ltr">' + r[1] + '</td><td><span class="pbadge ' + (r[2] === 'قطبی' ? 'p' : 'n') + '">' + r[2] + '</span></td></tr>').join('') + '</tbody></table></div><p class="small muted" style="margin:8px 0 0">قاعده: اگر همه‌ی اتم‌های متصل به اتم مرکزی یکسان باشند و آرایش کاملاً متقارن باشد، مولکول ناقطبی است؛ جفت ناپیوندی نامتقارن یا اتم‌های متفاوت، مولکول را قطبی می‌کند.</p></div>' +
      '<div class="card"><h2>۵) رفتار در میدان الکتریکی</h2><p>مولکول‌های قطبی در میدان الکتریکی جهت‌گیری می‌کنند: سر δ+ به سوی صفحه‌ی منفی و سر δ− به سوی صفحه‌ی مثبت می‌چرخد. مولکول‌های ناقطبی چنین جهت‌گیری‌ای ندارند. نزدیک کردن میله‌ی باردار به باریکه‌ی آب، آن را منحرف می‌کند؛ ولی باریکه‌ی هگزان (ناقطبی) منحرف نمی‌شود.</p><button class="btn block" data-act="cstab" data-st="pol" data-id="field">شبیه‌ساز میدان الکتریکی</button></div>' +
      '<div class="card"><h2>۶) روش تشخیص در چهار گام</h2>' + stepsHTML(['ساختار لوویس و شکل مولکول را (با VSEPR) مشخص کن.', 'برای هر پیوند ΔEN را حساب کن: صفر ← ناقطبی، غیر صفر ← قطبی؛ جهت پیکان را از δ+ به δ− بکش.', 'ببین ممان‌ها یکدیگر را خنثی می‌کنند یا نه (تقارن، جفت ناپیوندی، اتم‌های متفاوت).', 'برآیند صفر ← ناقطبی؛ برآیند ناصفر ← قطبی.']) + '</div>' +
      '<div class="card"><h2>۷) قطبیت چه تأثیری دارد؟</h2><ul class="guide-list small"><li><b>انحلال‌پذیری:</b> «مشابه، مشابه را حل می‌کند»؛ ماده‌ی قطبی در حلال قطبی (مثل آب) و ماده‌ی ناقطبی در حلال ناقطبی (مثل هگزان) بهتر حل می‌شود.</li><li><b>نقطه‌ی جوش:</b> بین مولکول‌های قطبی نیروی جاذبه‌ی دوقطبی–دوقطبی هست؛ در مولکول‌های هم‌اندازه، قطبی‌ها معمولاً نقطه‌ی جوش بالاتری دارند.</li><li><b>کاربرد:</b> مولکول‌های صابون یک سر قطبی و یک دم ناقطبی دارند و به همین دلیل چربی را از سطح جدا می‌کنند.</li></ul></div>';
  }
  VIEWS.pol = () => {
    const p = S.cs.pol; let body;
    if (p.tab === 'learn') body = polLearn();
    else if (p.tab === 'list') {
      body = '<label class="search">' + icon('search') + '<input id="pol-q" type="search" placeholder="فرمول یا نام؛ مثل H2O یا آمونیاک" value="' + esc(p.q) + '" autocomplete="off"></label>' +
        '<div class="row">' + [['all', 'همه'], ['polar', 'قطبی'], ['nonpolar', 'ناقطبی'], ['sym', 'پیوند قطبی، مولکول ناقطبی'], ['di', 'دواتمی'], ['org', 'آلی']].map((c) => '<button class="chip" data-act="polfilt" data-id="' + c[0] + '" aria-pressed="' + (p.filt === c[0]) + '">' + c[1] + '</button>').join('') + '</div>' +
        '<div id="cs-out">' + polList() + '</div>';
    } else if (p.tab === 'field') {
      body = '<div class="card flat"><p class="small muted" style="margin:0">یک مولکول انتخاب کن و میدان را روشن کن. مولکول‌های قطبی با پیکان نارنجی (μ) جهت‌گیری می‌کنند.</p></div>' +
        '<div class="row">' + FLD_MOLS.map((f) => '<button class="chip" data-act="fldmol" data-id="' + f + '" aria-pressed="' + (p.fm === f) + '"><span class="formula">' + CE.fmtF(f) + '</span></button>').join('') + '</div>' +
        '<div class="card" style="padding:8px">' + fieldSVG() + '</div>' +
        '<div class="row nowrap"><button class="btn primary grow" id="fld-btn" data-act="fldon">' + (p.fon ? 'خاموش کردن میدان' : 'روشن کردن میدان') + '</button><button class="btn grow" data-act="fldrev">جابه‌جایی قطب‌ها</button></div>' +
        '<div class="msg info" id="fld-txt">' + fieldText() + '</div>' +
        '<div class="card"><h2>آزمایش میله‌ی باردار</h2><div style="padding:4px">' + streamSVG() + '</div><button class="btn block" id="rod-btn" data-act="rod">' + (p.rod ? 'دور کردن میله' : 'نزدیک کردن میله‌ی باردار') + '</button><p class="small muted" style="margin:8px 0 0">آب قطبی است و مولکول‌هایش در میدان میله جهت‌گیری می‌کنند؛ سر δ+ به میله‌ی منفی نزدیک می‌شود و باریکه به سوی میله خم می‌شود. هگزان ناقطبی است و منحرف نمی‌شود.</p></div>';
    } else body = cqHTML('pol');
    return { title: 'مولکول‌های قطبی و ناقطبی', subtitle: 'ممان دوقطبی · تقارن · میدان الکتریکی', back: true, html: csTabs('pol', [['learn', 'تعریف'], ['list', 'مولکول‌ها'], ['field', 'میدان'], ['quiz', 'آزمون']]) + body };
  };

  /* ---------- quiz ---------- */
  const PNP = PE.MOLS.filter((m) => !['O3', 'CO', 'NO', 'N2O', 'NF3', 'OF2'].includes(m.f));
  const isPol = (m) => PE.analyze(m).polar;
  const mOpt = (m) => ({ k: m.f, h: CF(m.f) });
  QGEN.pol = () => {
    const t = pick(['np', 'p', 'reason', 'reason', 'bond', 'hx', 'sympolar', 'field', 'np', 'p']);
    const polars = PNP.filter(isPol), nons = PNP.filter((m) => !isPol(m));
    if (t === 'np' || t === 'sympolar') {
      const pool = t === 'sympolar' ? nons.filter((m) => polKind(m) === 'sym') : nons, right = pick(pool);
      return { q: t === 'sympolar' ? 'کدام مولکول با وجود داشتن پیوندهای قطبی، <b>ناقطبی</b> است؟' : 'کدام مولکول <b>ناقطبی</b> است؟', opts: mkOpts(mOpt(right), shuffle(polars).map(mOpt)), ans: right.f, why: CF(right.f) + ' ' + (polKind(right) === 'homo' ? 'پیوند ناقطبی دارد.' : 'ساختار متقارن دارد و برآیند ممان‌های دوقطبی پیوندها صفر می‌شود.') };
    }
    if (t === 'p' || t === 'field') {
      const right = pick(polars);
      return { q: t === 'field' ? 'کدام مولکول در میدان الکتریکی جهت‌گیری می‌کند؟' : 'کدام مولکول <b>قطبی</b> است؟', opts: mkOpts(mOpt(right), shuffle(nons).map(mOpt)), ans: right.f, why: CF(right.f) + ' ساختار نامتقارن دارد؛ برآیند ممان‌های دوقطبی صفر نیست، پس قطبی است و در میدان الکتریکی جهت‌گیری می‌کند.' };
    }
    if (t === 'reason') {
      const m = pick(PNP), an = PE.analyze(m);
      const R = { homo: 'همه‌ی پیوندها ناقطبی‌اند (اتم‌های یکسان).', sym: 'پیوندها قطبی‌اند ولی آرایش متقارن است و برآیند ممان‌ها صفر می‌شود.', polar: 'پیوندها قطبی‌اند و آرایش نامتقارن است، پس برآیند ممان‌ها صفر نمی‌شود.' };
      const wrongs = [tOpt('چون ΔEN هر پیوند صفر است، مولکول همیشه ناقطبی است.'), tOpt('چون مولکول جفت ناپیوندی دارد، همیشه قطبی است.'), tOpt('هر مولکولی که پیوند قطبی دارد، قطبی است.'), tOpt('مولکول‌های خمیده همیشه ناقطبی‌اند.')];
      const rightK = R[an.kind];
      return { q: 'درباره‌ی ' + CF(m.f) + ' (' + m.fa + ') کدام گزاره درست است؟', opts: mkOpts(tOpt(rightK), shuffle(Object.keys(R).filter((k) => k !== an.kind).map((k) => tOpt(R[k])).concat(wrongs)).filter((o) => o.k !== rightK).slice(0, 3)), ans: rightK, why: rightK };
    }
    if (t === 'bond') {
      const bonds = [['H', 'F'], ['H', 'Cl'], ['H', 'Br'], ['H', 'I'], ['O', 'H'], ['N', 'H'], ['C', 'H'], ['C', 'O'], ['C', 'Cl'], ['S', 'H'], ['C', 'N'], ['C', 'F']].map((b) => ({ b, d: Math.abs(PE.EN(b[0]) - PE.EN(b[1])) }));
      let pickd; for (;;) { pickd = shuffle(bonds).slice(0, 4); if (new Set(pickd.map((x) => x.d.toFixed(2))).size === 4) break; }
      const most = Math.random() < 0.6, sorted = pickd.slice().sort((a, b) => (most ? b.d - a.d : a.d - b.d)), right = sorted[0];
      const o = (x) => ({ k: x.b.join('-'), h: '<span class="sym">' + x.b[0] + '–' + x.b[1] + '</span>' });
      return { q: 'کدام پیوند ' + (most ? '<b>قطبی‌تر</b>' : '<b>کم‌قطبی‌تر</b>') + ' است؟', opts: shuffle(pickd.map(o)), ans: o(right).k, why: 'قطبیت پیوند با ΔEN بیشتر می‌شود: ' + sorted.map((x) => x.b[0] + '–' + x.b[1] + ' (' + enTxt(x.d) + ')').join(' ، ') + '.' };
    }
    const hx = ['HF', 'HCl', 'HBr', 'HI'].map(PE.byFormula), most = Math.random() < 0.5, ord = hx.slice().sort((a, b) => (most ? b.mu - a.mu : a.mu - b.mu));
    return { q: 'ممان دوقطبی کدام مولکول ' + (most ? '<b>بیشتر</b>' : '<b>کمتر</b>') + ' است؟', opts: shuffle(hx.map(mOpt)), ans: ord[0].f, why: 'از F به I الکترونگاتیوی هالوژن کم می‌شود، پس ΔEN و ممان دوقطبی کاهش می‌یابد: HF > HCl > HBr > HI.' };
  };
  QINFO.pol = ['آزمون قطبیت', 'قطبی یا ناقطبی بودن، تقارن، ΔEN و ممان دوقطبی.'];

  /* ---------- registration + events ---------- */
  MODULES.push({ id: 'pol', title: 'مولکول‌های قطبی و ناقطبی', sub: 'ممان دوقطبی · تقارن · میدان الکتریکی', ic: 'pol', go: () => go('pol') });
  function POL_CLICK(act, id, el) {
    const p = S.cs.pol;
    switch (act) {
      case 'polfilt': p.filt = id; render(); return true;
      case 'poldet': go('poldet', { f: id }); return true;
      case 'fldmol': p.fm = id; p.fon = false; render(); return true;
      case 'fldon': p.fon = !p.fon; applyField(); return true;
      case 'fldrev': p.frev = !p.frev; applyField(); return true;
      case 'rod': { p.rod = !p.rod; const s = $('#strm'); if (s) s.classList.toggle('on', p.rod); const b = $('#rod-btn'); if (b) b.textContent = p.rod ? 'دور کردن میله' : 'نزدیک کردن میله‌ی باردار'; return true; }
      default: return false;
    }
  }

  /* ===== Games, fun facts, applications ===== */
  CE.FA_EL.He = 'هلیم'; CE.MASS.He = [4, 4.0026];
  S.cs.fun = { mem: null, arc: { sym: null, pol: null }, factIdx: Math.floor(Date.now() / 864e5), factCat: 'all', appCat: 'all', arcBest: store.get('arcBest', {}), memBest: store.get('memBest', 0) };
  const nameFor = (f) => FNAME[f] || (CE.nameAny(f).ok ? CE.nameAny(f).name : f);

  /* ---------- memory game ---------- */
  const MEM_F = ['NaCl', 'H2O', 'CO2', 'NH3', 'CH4', 'CaCO3', 'NaOH', 'H2SO4', 'HCl', 'MgO', 'Fe2O3', 'KMnO4', 'AgNO3', 'Al2O3', 'CaO', 'HNO3', 'KOH', 'Na2CO3', 'C6H12O6', 'CuSO4', 'SO2', 'CuO', 'C2H5OH', 'NaHCO3'];
  function memNew() {
    const fs = shuffle(MEM_F).slice(0, 8);
    const cards = shuffle(fs.flatMap((f, i) => [{ p: i, h: CF(f), k: 'f' }, { p: i, h: nameFor(f), k: 'n' }])).map((c, id) => Object.assign(c, { id, open: false, done: false }));
    return { cards, sel: [], moves: 0, lock: false, matched: 0 };
  }
  VIEWS.gmem = () => {
    const f = S.cs.fun, g = f.mem;
    if (!g) return { title: 'حافظه‌ی شیمی', subtitle: 'فرمول را به نامش وصل کن', back: true, html: '<div class="card"><h2>بازی حافظه</h2><p>۱۶ کارت پشت‌ورو شده است: ۸ فرمول و ۸ نام. دو کارت را باز کن؛ اگر فرمول و نام یک ماده بودند، جفت می‌شوند. با کمترین حرکت همه را پیدا کن.</p><p class="small muted">کمترین حرکت: ' + (f.memBest ? fa(f.memBest) : '—') + '</p><button class="btn primary block" data-act="memstart">شروع بازی</button></div>' };
    const done = g.matched === 8;
    return {
      title: 'حافظه‌ی شیمی', subtitle: fa(g.moves) + ' حرکت · ' + fa(g.matched) + ' از ۸ جفت', back: true,
      html: '<div class="memgrid">' + g.cards.map((c) => '<button class="mcardf' + (c.open || c.done ? ' open' : '') + (c.done ? ' done' : '') + (c.k === 'f' ? ' fm' : '') + '" data-act="memflip" data-id="' + c.id + '" aria-label="کارت ' + fa(c.id + 1) + '">' + (c.open || c.done ? '<span>' + c.h + '</span>' : '<i class="qm">?</i>') + '</button>').join('') + '</div>' +
        (done ? '<div class="msg ok" role="status">آفرین! همه‌ی جفت‌ها را با ' + fa(g.moves) + ' حرکت پیدا کردی.' + (g.moves <= f.memBest && f.memBest ? ' رکورد تازه!' : '') + '</div>' : '') +
        '<button class="btn block" data-act="memstart">' + (done ? 'بازی تازه' : 'شروع دوباره') + '</button>'
    };
  };

  /* ---------- arcade (3 lives) ---------- */
  const SYM_EL = ['H', 'He', 'Li', 'Be', 'B', 'C', 'N', 'O', 'F', 'Ne', 'Na', 'Mg', 'Al', 'Si', 'P', 'S', 'Cl', 'Ar', 'K', 'Ca', 'Fe', 'Cu', 'Zn', 'Br', 'Ag', 'I', 'Au', 'Hg', 'Pb', 'Sn', 'Ba', 'Mn', 'Cr', 'Ni', 'Co', 'Ti'];
  function arcGen(key, last) {
    if (key === 'sym') {
      let e; do { e = pick(SYM_EL); } while (last && e === last.e);
      const n2s = Math.random() < 0.55;
      const others = shuffle(SYM_EL.filter((x) => x !== e));
      const near = others.filter((x) => x[0] === e[0]);
      const ds = near.slice(0, 1).concat(others).filter((x, i, a) => a.indexOf(x) === i).slice(0, 3);
      const all = shuffle([e].concat(ds));
      if (n2s) return { e, q: 'نماد شیمیایی «<b>' + CE.FA_EL[e] + '</b>» کدام است؟', opts: all.map((x) => ({ k: x, h: '<span class="sym" style="font-size:22px">' + x + '</span>' })), ans: e, why: CE.FA_EL[e] + ' = ' + e + '.' };
      return { e, q: 'نام عنصر <span class="sym" style="font-size:26px">' + e + '</span> چیست؟', opts: all.map((x) => ({ k: x, h: CE.FA_EL[x] })), ans: e, why: e + ' = ' + CE.FA_EL[e] + '.' };
    }

      secCard('خودیونش آب و pH', '<div class="eqs">' + rxH('2H2O = H3O^+ + OH^-', '⇌') + '</div>' + bullets(['<b>ثابت یونش آب:</b> <span class="formula" dir="ltr">K<sub>w</sub> = [H₃O⁺][OH⁻] = ۱×۱۰⁻¹⁴</span> (در ۲۵°C).', '<b>pH</b> = −log[H₃O⁺] ، <b>pOH</b> = −log[OH⁻] ، و <b>pH + pOH = ۱۴</b>.', 'محلول <b>اسیدی</b>: pH < ۷ ؛ <b>خنثی</b>: pH = ۷ ؛ <b>بازی</b>: pH > ۷.', 'هر یک واحد کاهش pH یعنی [H₃O⁺] ده برابر شده است.', 'در محلول اسید قوی تک‌پروتونی: [H₃O⁺] ≈ غلظت اسید. در اسید ضعیف: <span class="formula" dir="ltr">[H₃O⁺] ≈ √(Ka × C)</span>.']) + phBar(7, 'ref')) +
      secCard('واکنش‌های مهم', '<div class="eqs">' + [['اسید + فلز فعال', 'Mg + 2HCl = MgCl2 + H2'], ['اسید + کربنات', 'CaCO3 + 2HCl = CaCl2 + H2O + CO2'], ['اسید + باز (خنثی‌شدن)', 'HCl + NaOH = NaCl + H2O'], ['اسید + اکسید فلزی', 'CuO + H2SO4 = CuSO4 + H2O']].map((r) => '<div class="eqrow"><span class="small muted">' + r[0] + '</span>' + rxH(r[1]) + '</div>').join('') + '</div><p class="small muted" style="margin:8px 0 0">در واکنش خنثی‌شدن، اسید و باز یکدیگر را مصرف می‌کنند و نمک و آب می‌سازند.</p>') +
      secCard('پنج اسید که باید حفظ باشید', bullets(['<b>HCl</b> (جوهر نمک): اسید معده و پاک‌کننده.', '<b>H₂SO₄</b>: باتری ماشین و کودسازی.', '<b>HNO₃</b>: کود و مواد منفجره.', '<b>CH₃COOH</b>: سرکه.', '<b>H₃PO₄</b>: کود و نوشابه‌ی کولا.']));
  }

  /* ---------- list ---------- */
  function acList() {
    const a = S.cs.acid;
    const L = SE.ACIDS.filter((x) => (a.kind === 'all' || x.t === a.kind) && (a.str === 'all' || x.s === a.str));
    const row = (x) => {
      const open = a.open === x.f;
      const det = open ? '<div class="acdet"><div class="eqs">' + rxH(x.eq, x.s === 'strong' ? '→' : '⇌') + '</div>' +
        (x.K ? '<p class="small" style="margin:6px 0 0"><b>' + (x.t === 'a' ? 'K<sub>a</sub>' : 'K<sub>b</sub>') + ' =</b> ' + sciH(x.K, 1) + '</p>' : '') +
        '<p class="small" style="margin:6px 0 0"><b>ویژگی:</b> ' + x.prop + '</p><p class="small" style="margin:6px 0 0"><b>کاربرد:</b> ' + x.use + '</p>' +
        '<button class="btn block" style="margin-top:8px" data-act="acuse" data-id="' + x.f + '">محاسبه‌ی pH این ماده</button></div>' : '';
      return '<div class="acrow' + (open ? ' open' : '') + '"><button class="achead" data-act="acopen" data-id="' + x.f + '" aria-expanded="' + open + '"><span class="acf">' + CE.fHTML(x.f) + '</span><span class="acn"><b>' + nameShort(x) + '</b><span>' + typeBadge(x) + ' ' + strBadge(x) + '</span></span><i class="chev"></i></button>' + det + '</div>';
    };
    const weak = SE.ACIDS.filter((x) => x.s === 'weak' && x.K && x.t === 'a').sort((p, q) => q.K - p.K);
    const maxp = Math.max.apply(null, weak.map((x) => -Math.log10(x.K)));
    const bars = '<div class="kbars">' + weak.map((x) => { const pk = -Math.log10(x.K); return '<div class="kb"><span class="acf">' + CE.fHTML(x.f) + '</span><div class="tr"><i style="width:' + Math.max(6, (1 - (pk - 2) / (maxp - 1.2)) * 100) + '%"></i></div><span class="num small">' + sciH(x.K, 1) + '</span></div>'; }).join('') + '</div>';
    return '<div class="row">' + [['all', 'همه'], ['a', 'اسیدها'], ['b', 'بازها']].map((c) => '<button class="chip" data-act="ackind" data-id="' + c[0] + '" aria-pressed="' + (a.kind === c[0]) + '">' + c[1] + '</button>').join('') + '<span class="sep"></span>' + [['all', 'قوی و ضعیف'], ['strong', 'قوی'], ['weak', 'ضعیف']].map((c) => '<button class="chip" data-act="acstr" data-id="' + c[0] + '" aria-pressed="' + (a.str === c[0]) + '">' + c[1] + '</button>').join('') + '</div>' +
      '<div class="acl">' + (L.length ? L.map(row).join('') : '<div class="empty">موردی نیست.</div>') + '</div>' +
      secCard('مقایسه‌ی قدرت اسیدهای ضعیف', '<p class="small muted" style="margin:0 0 8px">هر چه Ka بزرگ‌تر، اسید قوی‌تر (میله‌ی بلندتر).</p>' + bars);
  }

  /* ---------- pH calculators ---------- */
  function acCalcOut() {
    const a = S.cs.acid, x = ACID_BY(a.sub), C = num(a.conc);
    if (!x) return '';
    if (!C) return '<div class="msg err" role="status">غلظت را به‌صورت عدد مثبت (mol/L) بنویس؛ مثل ۰٫۰۱.</div>';
    if (C > 12) return '<div class="msg err" role="status">غلظت خیلی بزرگ است؛ عددی کمتر از ۱۲ mol/L بنویس.</div>';
    const base = x.t === 'b', steps = []; let r;
    if (x.s === 'strong') {
      r = SE.strongPH(C, x.n, base);
      const n = x.n;
      steps.push((base ? 'باز قوی است و کامل تفکیک می‌شود: ' : 'اسید قوی است و کامل یونیده می‌شود: ') + rxH(x.eq));
      steps.push((base ? '[OH⁻]' : '[H₃O⁺]') + ' = ' + (n > 1 ? sF(n) + ' × ' : '') + sfmt(C, 4) + ' = ' + sciH(n * C, 3) + ' mol/L');
      steps.push((base ? 'pOH' : 'pH') + ' = −log(' + sciH(n * C, 3) + ') = <b>' + sfmt(base ? r.pOH : r.pH) + '</b>');
      if (base) steps.push('pH = ۱۴ − ' + sfmt(r.pOH) + ' = <b>' + sfmt(r.pH) + '</b>');
      if (x.f === 'H2SO4') steps.push('<span class="muted">برای H₂SO₄ فقط مرحله‌ی اول کامل است؛ در غلظت‌های رقیق اثر مرحله‌ی دوم هم دیده می‌شود، اما در سطح کتاب هر دو H را حساب می‌کنیم.</span>');
    } else {
      r = SE.weakPH(x.K, C, base);
      steps.push((base ? 'باز ضعیف است و فقط اندکی واکنش می‌دهد: ' : 'اسید ضعیف است و فقط اندکی یونیده می‌شود: ') + rxH(x.eq, '⇌'));
      steps.push((base ? 'K<sub>b</sub>' : 'K<sub>a</sub>') + ' = ' + sciH(x.K, 1) + ' ، C = ' + sfmt(C, 4) + ' mol/L');
      steps.push((base ? '[OH⁻]' : '[H₃O⁺]') + ' ≈ √(K × C) = √(' + sciH(x.K, 1) + ' × ' + sfmt(C, 4) + ') = ' + sciH(base ? r.oh : r.h, 3) + ' mol/L');
      steps.push((base ? 'pOH' : 'pH') + ' = −log(' + sciH(base ? r.oh : r.h, 3) + ') = <b>' + sfmt(base ? r.pOH : r.pH) + '</b>' + (base ? ' ← pH = ۱۴ − ' + sfmt(r.pOH) + ' = <b>' + sfmt(r.pH) + '</b>' : ''));
      steps.push('درجه‌ی یونش: α = (' + sciH(base ? r.oh : r.h, 3) + ' ÷ ' + sfmt(C, 4) + ') × ۱۰۰ = <b>' + sfmt(r.alpha) + '٪</b>');
      if (r.alpha > 5) steps.push('<span class="muted">α بزرگ‌تر از ۵٪ است؛ تقریب √(K·C) دقیق نیست. مقدار دقیق‌تر: pH ≈ ' + sfmt(r.exactPH) + '.</span>');
    }
    const pH = r.pH;
    return '<div class="phres"><div class="pv num" style="--c:' + SE.uniColor(Math.max(0, Math.min(14, pH))) + '">' + sfmt(pH) + '</div><div><div class="small muted">pH محلول</div>' + natureBadge(pH) + '</div></div>' + phBar(pH) + stepsHTML(steps);
  }
  const CONV = [['pH', 'pH'], ['pOH', 'pOH'], ['H', '[H₃O⁺] (mol/L)'], ['OH', '[OH⁻] (mol/L)']];
  function acConvOut() {
    const a = S.cs.acid; let s = String(a.cval).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g, '.').trim().replace(/[×x]\s*10\^?/i, 'e');
    const v = Number(s);
    if (!s || !isFinite(v)) return '<div class="empty">یک عدد بنویس؛ برای توان ده می‌توانی 1e-4 بنویسی.</div>';
    let r;
    if (a.conv === 'pH') r = SE.fromPH(v);
    else if (a.conv === 'pOH') r = SE.fromPH(14 - v);
    else { if (v <= 0) return '<div class="msg err" role="status">غلظت باید مثبت باشد.</div>'; r = a.conv === 'H' ? SE.fromH(v) : SE.fromOH(v); }
    const rows = [['pH', sfmt(r.pH)], ['pOH', sfmt(r.pOH)], ['[H₃O⁺]', sciH(r.h, 3) + ' mol/L'], ['[OH⁻]', sciH(r.oh, 3) + ' mol/L']];
    return '<div class="convgrid">' + rows.map((x) => '<div class="cv"><span class="small muted">' + x[0] + '</span><b class="num">' + x[1] + '</b></div>').join('') + '</div><div class="row" style="align-items:center">' + natureBadge(r.pH) + '</div>' + phBar(r.pH) +
      '<p class="small muted" style="margin:6px 0 0">pH + pOH = ۱۴ ؛ [H₃O⁺] × [OH⁻] = ۱×۱۰⁻¹⁴</p>';
  }
  function acSubstances() {
    return '<div class="subs">' + SE.SUBST.map((x) => '<div class="sub-r"><i style="background:' + SE.uniColor(Math.max(0, Math.min(14, x.pH))) + '"></i><span>' + x.fa + '</span><b class="num">' + sfmt(x.pH, 1) + '</b></div>').join('') + '</div>';
  }
  function acPH() {
    const a = S.cs.acid;
    const opts = '<optgroup label="اسیدها">' + SE.ACIDS.filter((x) => x.t === 'a').map((x) => '<option value="' + x.f + '"' + (a.sub === x.f ? ' selected' : '') + '>' + nameShort(x) + ' (' + x.f + ')</option>').join('') + '</optgroup><optgroup label="بازها">' + SE.ACIDS.filter((x) => x.t === 'b').map((x) => '<option value="' + x.f + '"' + (a.sub === x.f ? ' selected' : '') + '>' + nameShort(x) + ' (' + x.f + ')</option>').join('') + '</optgroup>';
    return secCard('محاسبه‌ی pH یک محلول', '<div class="field"><label for="ac-sub">ماده</label><select class="sel" id="ac-sub">' + opts + '</select></div><div class="field"><label for="ac-conc">غلظت (mol/L)</label><input class="inp" id="ac-conc" inputmode="decimal" dir="ltr" value="' + esc(a.conc) + '" autocomplete="off"></div><div class="row">' + ['0.1', '0.01', '0.001', '1'].map((v) => '<button class="chip" data-act="acconc" data-id="' + v + '">' + sF(v) + '</button>').join('') + '</div><div id="ac-calc-out">' + acCalcOut() + '</div>') +
      secCard('تبدیل pH ، pOH و غلظت', '<div class="row">' + CONV.map((c) => '<button class="chip" data-act="acconv" data-id="' + c[0] + '" aria-pressed="' + (a.conv === c[0]) + '">' + c[1] + '</button>').join('') + '</div><div class="field"><label for="ac-cval">مقدار</label><input class="inp" id="ac-cval" inputmode="decimal" dir="ltr" value="' + esc(a.cval) + '" autocomplete="off"></div><div id="ac-conv-out">' + acConvOut() + '</div>') +
      secCard('pH مواد در زندگی', '<p class="small muted" style="margin:0 0 8px">رنگ هر نقطه همان رنگ شناساگر جهانی در آن pH است.</p>' + acSubstances()) +
      secCard('pH را چطور اندازه می‌گیریم؟', stepsHTML([
        '<b>کاغذ pH (یا نوار pH):</b> نوار را در محلول فرو می‌بریم و رنگ آن را با مقیاس رنگی روی بسته مقایسه می‌کنیم. ساده است و دقت حدود یک واحد دارد.',
        '<b>شناساگر جهانی:</b> مخلوطی از چند شناساگر که در هر pH رنگ متفاوتی دارد (قرمز ← نارنجی ← زرد ← سبز ← آبی ← بنفش).',
        '<b>pH‌متر:</b> الکترود شیشه‌ای ولتاژ ناشی از [H₃O⁺] را می‌خواند و دستگاه آن را به عدد pH تبدیل می‌کند؛ دقت تا ۰٫۰۱.',
        '<b>کالیبره کردن pH‌متر:</b> پیش از کار با دو یا سه محلول بافر استاندارد (مثلاً pH = ۴ ، ۷ و ۱۰) آن را تنظیم می‌کنیم.',
        '<b>هنگام کار:</b> الکترود را بعد از هر اندازه‌گیری با آب مقطر بشوی، آرام هم بزن و صبر کن عدد ثابت شود. pH به دما هم وابسته است.'
      ]));
  }

  /* ---------- lab ---------- */
  function beakerSVG(pH) {
    const col = SE.uniColor(Math.max(0, Math.min(14, pH)));
    return '<svg viewBox="0 0 120 120" class="beaker" role="img" aria-label="لیوان شیمیایی با شناساگر جهانی"><path d="M30 18v78a8 8 0 0 0 8 8h44a8 8 0 0 0 8-8V18" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><path d="M33 44h54v52a6 6 0 0 1-6 6H39a6 6 0 0 1-6-6z" fill="' + col + '" opacity=".92"/><path d="M33 44h54" stroke="rgba(255,255,255,.55)" stroke-width="2"/><g fill="rgba(255,255,255,.55)"><circle cx="48" cy="86" r="2.2"/><circle cx="62" cy="70" r="1.8"/><circle cx="72" cy="90" r="2.4"/></g></svg>';
  }
  function tubeSVG(c) { return '<svg viewBox="0 0 24 48" class="tube"><path d="M5 3h14v34a7 7 0 0 1-14 0z" fill="none" stroke="var(--ink)" stroke-width="2"/><path d="M6 20h12v17a6 6 0 0 1-12 0z" fill="' + c + '"/></svg>'; }
  function acLabOut() {
    const pH = S.cs.acid.ph, r = SE.fromPH(pH);
    return '<div class="labrow">' + beakerSVG(pH) + '<div><div class="phres" style="margin:0"><div class="pv num" style="--c:' + SE.uniColor(pH) + '">' + sfmt(pH, 1) + '</div>' + natureBadge(pH) + '</div><p class="small" style="margin:6px 0 0">[H₃O⁺] = ' + sciH(r.h, 2) + '<br>[OH⁻] = ' + sciH(r.oh, 2) + '</p></div></div>' +
      '<div class="inds">' + SE.IND.map((ind) => { const c = SE.indColor(ind, pH); return '<div class="ind">' + tubeSVG(c.c) + '<b>' + ind.fa + '</b><span class="small">' + c.name + '</span><span class="small muted num">' + sF(ind.lo) + ' تا ' + sF(ind.hi) + '</span></div>'; }).join('') + '</div>';
  }
  const titrPH = (V) => {
    const CA = 0.1, VA = 25, CB = 0.1, nA = CA * VA, nB = CB * V, Vt = VA + V;
    if (Math.abs(nA - nB) < 1e-9) return 7;
    if (nA > nB) return -Math.log10((nA - nB) / Vt);
    return 14 + Math.log10((nB - nA) / Vt);
  };
  function titrationSVG(V) {
    const X = (v) => 28 + (v / 50) * 220, Y = (p) => 128 - (p / 14) * 112;
    let d = ''; for (let v = 0; v <= 50.01; v += 0.5) { const p = Math.max(0, Math.min(14, titrPH(v === 25 ? 25 : v))); d += (d ? 'L' : 'M') + X(v).toFixed(1) + ' ' + Y(p).toFixed(1); }
    const pH = Math.max(0, Math.min(14, titrPH(V)));
    const ph = SE.IND[4];
    return '<svg viewBox="0 0 260 150" class="titr" role="img" aria-label="منحنی تیتراسیون"><rect x="28" y="' + Y(ph.hi) + '" width="220" height="' + (Y(ph.lo) - Y(ph.hi)) + '" fill="#D81B60" opacity=".14"/><g stroke="var(--line)" stroke-width="1"><path d="M28 16v112h220"/>' + [0, 7, 14].map((p) => '<path d="M28 ' + Y(p) + 'h220" opacity=".5"/>').join('') + '</g><g font-size="9" fill="var(--muted)" font-family="Vazirmatn,sans-serif" text-anchor="middle">' + [0, 7, 14].map((p) => '<text x="18" y="' + (Y(p) + 3) + '">' + sF(p) + '</text>').join('') + [0, 25, 50].map((v) => '<text x="' + X(v) + '" y="142">' + sF(v) + '</text>').join('') + '<text x="136" y="12" fill="#D81B60">گستره‌ی فنول‌فتالئین</text></g><path d="' + d + '" fill="none" stroke="var(--brand)" stroke-width="2.4"/><circle cx="' + X(V) + '" cy="' + Y(pH) + '" r="5" fill="#E4572E" stroke="#fff" stroke-width="1.6"/></svg>';
  }
  function acTitrOut() {
    const V = S.cs.acid.vol, pH = titrPH(V), col = SE.indColor(SE.IND[4], pH);
    const flask = '<svg viewBox="0 0 90 100" class="flask" role="img" aria-label="ارلن با فنول‌فتالئین"><path d="M36 8h18M38 8v28L14 82a8 8 0 0 0 7 12h48a8 8 0 0 0 7-12L52 36V8" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M24 70h42l6 12a6 6 0 0 1-5 9H23a6 6 0 0 1-5-9z" fill="' + col.c + '" opacity=".95"/></svg>';
    const state = Math.abs(V - 25) < 1e-9 ? 'نقطه‌ی هم‌ارزی (خنثی‌شدن کامل)' : V < 25 ? 'هنوز اسید اضافی دارد' : 'باز اضافی دارد';
    return '<div class="labrow">' + flask + '<div><div class="phres" style="margin:0"><div class="pv num" style="--c:' + SE.uniColor(Math.max(0, Math.min(14, pH))) + '">' + sfmt(pH, 2) + '</div>' + natureBadge(pH) + '</div><p class="small" style="margin:6px 0 0">باز افزوده‌شده: <b class="num">' + sfmt(V, 1) + ' mL</b><br>رنگ فنول‌فتالئین: <b>' + col.name + '</b><br><span class="muted">' + state + '</span></p></div></div>' + titrationSVG(V);
  }
  const NZ_AN = [[1, 'اسید تک‌پروتونی (HCl ، HNO₃ ، CH₃COOH)'], [2, 'اسید دوپروتونی (H₂SO₄)'], [3, 'اسید سه‌پروتونی (H₃PO₄)']];
  const NZ_BN = [[1, 'باز تک‌هیدروکسیدی (NaOH ، KOH)'], [2, 'باز دوهیدروکسیدی (Ca(OH)₂ ، Ba(OH)₂)']];
  const NZ_UN = [['MA', 'غلظت اسید (M<sub>A</sub>)'], ['VA', 'حجم اسید (V<sub>A</sub>)'], ['MB', 'غلظت باز (M<sub>B</sub>)'], ['VB', 'حجم باز (V<sub>B</sub>)']];
  function acNeutOut() {
    const z = S.cs.acid.nz, v = {}; let bad = false;

  function ecKey() {
    const cmp = [['انرژی', 'شیمیایی ← الکتریکی', 'الکتریکی ← شیمیایی'], ['واکنش', 'خودبه‌خودی', 'غیرخودبه‌خودی (با منبع بیرونی)'], ['آند', 'اکسایش · قطب منفی (−)', 'اکسایش · قطب مثبت (+)'], ['کاتد', 'کاهش · قطب مثبت (+)', 'کاهش · قطب منفی (−)'], ['emf', 'مثبت', 'منفی (باید ولتاژ بیرونی داد)'], ['ظرف', 'دو نیم‌سلول + پل نمکی', 'معمولاً یک ظرف']];
    return secCard('اکسایش و کاهش', bullets(['<b>اکسایش:</b> از دست دادن الکترون ← افزایش عدد اکسایش. <b>کاهش:</b> گرفتن الکترون ← کاهش عدد اکسایش.', '<b>کاهنده:</b> دهنده‌ی الکترون (خودش اکسید می‌شود). <b>اکسنده:</b> گیرنده‌ی الکترون (خودش کاهیده می‌شود).', 'اکسایش و کاهش همیشه هم‌زمان رخ می‌دهند و شمار الکترون‌های داده‌شده و گرفته‌شده برابر است.']) + '<div class="eqs">' + rxH('Zn + Cu^2+ = Zn^2+ + Cu') + '</div><p class="small muted" style="margin:6px 0 0">Zn کاهنده است (۰ ← +۲) و Cu²⁺ اکسنده (+۲ ← ۰).</p>') +
      secCard('سلول گالوانی', bullets(['در سلول گالوانی، واکنش اکسایش–کاهش خودبه‌خودی در دو نیم‌سلول جدا انجام می‌شود و الکترون‌ها از سیم بیرونی عبور می‌کنند.', '<b>آند:</b> محل اکسایش، قطب منفی. <b>کاتد:</b> محل کاهش، قطب مثبت.', 'الکترون‌ها در سیم از <b>آند به سمت کاتد</b> می‌روند.', '<b>پل نمکی:</b> مدار را می‌بندد و با حرکت یون‌ها بار محلول‌ها را خنثی نگه می‌دارد (آنیون‌ها به سوی آند، کاتیون‌ها به سوی کاتد).', 'جرم الکترود آند کم و جرم الکترود کاتد (فلزی) زیاد می‌شود.', 'نمادگذاری: <span class="formula" dir="ltr">Zn | Zn²⁺ || Cu²⁺ | Cu</span> (آند سمت چپ و کاتد سمت راست).']) + '<button class="btn block" data-act="cstab" data-st="ech" data-id="cell">سلول را خودت بساز ←</button>') +
      secCard('emf و پتانسیل کاهش استاندارد (E°)', bullets(['<b>E°</b> توان گرفتن الکترون یک نیم‌واکنش کاهشی را نشان می‌دهد؛ مرجع، <b>الکترود استاندارد هیدروژن (SHE)</b> با E° = ۰٫۰۰ V است (Pt، ۱ mol/L H⁺ ، ۱ atm H₂ ، ۲۵°C).', 'هر چه E° بزرگ‌تر، <b>اکسنده‌ی</b> آن قوی‌تر؛ هر چه کوچک‌تر، شکل کاهیده‌اش <b>کاهنده‌ی</b> قوی‌تر.', '<span class="formula" dir="ltr">emf = E°<sub>کاتد</sub> − E°<sub>آند</sub></span> ؛ در سلول گالوانی همیشه مثبت است.', 'ضرب‌کردن ضرایب نیم‌واکنش در عدد، E° را تغییر نمی‌دهد (E° خاصیت شدتی است).', 'واکنش وقتی خودبه‌خودی است که emf مثبت باشد؛ مثلاً Zn–Cu: ۰٫۳۴ − (−۰٫۷۶) = ۱٫۱۰ V.']) + '<button class="btn block" data-act="cstab" data-st="ech" data-id="tab">جدول E° ←</button>') +
      secCard('سری الکتروشیمیایی فلزها', '<p class="small" style="margin:0 0 8px">از کاهنده‌ترین فلز (E° کوچک) تا کم‌کاهنده‌ترین:</p><div class="series" dir="ltr">' + metalSeries().map((c) => '<span class="' + (c.kind === 'H' ? 'h' : '') + '">' + (c.kind === 'H' ? 'H' : c.red) + '</span>').join('<i>›</i>') + '</div>' + bullets(['هر فلز، فلزهای سمت راست خود را از محلول نمکشان بیرون می‌آورد: Fe + Cu²⁺ → Fe²⁺ + Cu.', 'فلزهای سمت چپ H با اسیدهای رقیق گاز H₂ می‌دهند؛ Cu و Ag و Au با اسید رقیق واکنش نمی‌دهند.'])) +
      secCard('سلول گالوانی در برابر سلول الکترولیتی', '<div class="table-wrap"><table class="atoms cmp"><thead><tr><th></th><th>گالوانی</th><th>الکترولیتی</th></tr></thead><tbody>' + cmp.map((r) => '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>').join('') + '</tbody></table></div><p class="small muted" style="margin:8px 0 0">در هر دو نوع، اکسایش در آند و کاهش در کاتد رخ می‌دهد؛ فقط علامت قطب‌ها عوض می‌شود.</p>') +
      secCard('پیل‌ها و باتری‌های مهم', bullets(['<b>پیل خشک (روی–کربن) و قلیایی:</b> آند روی؛ یک‌بار مصرف.', '<b>باتری سرب–اسید (خودرو):</b> <span class="formula" dir="ltr">Pb + PbO₂ + ۲H₂SO₄ ⇌ ۲PbSO₄ + ۲H₂O</span> ؛ قابل شارژ.', '<b>باتری لیتیم–یون:</b> سبک و پرانرژی؛ در موبایل و خودروی برقی.', '<b>سلول سوختی هیدروژن–اکسیژن:</b> <span class="formula" dir="ltr">۲H₂ + O₂ → ۲H₂O</span> ؛ تا وقتی سوخت برسد برق می‌دهد و فراورده‌اش فقط آب است.'])) +
      secCard('برق‌کافت (الکترولیز)', bullets(['با عبور جریان برق از مواد مذاب یا محلول، واکنش غیرخودبه‌خودی انجام می‌شود.', '<b>آند (+):</b> اکسایش ؛ <b>کاتد (−):</b> کاهش.', 'کاربردها: تهیه‌ی Na و Cl₂ از NaCl مذاب، Al از Al₂O₃، آبکاری، پالایش مس، تهیه‌ی NaOH.', 'در آبکاری، جسم مورد نظر کاتد (−) و فلز آبکاری، آند (+) است.']) + '<button class="btn block" data-act="cstab" data-st="ech" data-id="elec">برق‌کافت ←</button>') +
      secCard('خوردگی و حفاظت از آهن', bullets(['زنگ‌زدن آهن اکسایش آن در حضور <b>اکسیژن و آب</b> است و فراورده‌ی اصلی آن Fe₂O₃·xH₂O است.', 'روش‌ها: رنگ و روغن، آبکاری، پوشش روی (گالوانیزه) و <b>آند فداشونده</b> (Mg یا Zn).', 'روی (E° = −۰٫۷۶) از آهن (E° = −۰٫۴۴) کاهنده‌تر است؛ پس حتی اگر پوشش خراشیده شود، روی به‌جای آهن اکسید می‌شود. قلع (E° = −۰٫۱۴) تا وقتی پوشش سالم است محافظ است و پس از خراش خوردگی را تندتر می‌کند.', 'آلومینیم لایه‌ی چسبنده‌ی Al₂O₃ می‌سازد و دیگر خورده نمی‌شود.']));
  }

  /* ---------- oxidation numbers ---------- */
  function ecOxOut() {
    const o = S.cs.ech.ox, f = String(o.f || '').replace(/\s+/g, '');
    if (!f) return '<div class="empty">فرمول را بنویس؛ مثل KMnO4 یا Cr2O7 (با بار −۲).</div>';
    const r = SE.oxNumbers(f, +o.ch);
    if (!r.ok) return '<div class="msg err" role="status">' + r.error + '</div>';
    const rows = r.order.map((e) => '<div class="oxrow"><span class="oxe"><span class="sym">' + e + '</span><small class="muted">' + (CE.FA_EL[e] || '') + '</small></span><b class="oxn num">' + oxF(r.ox[e]) + '</b><span class="small muted">' + r.why[e] + '</span></div>').join('');
    const nonint = r.order.some((e) => r.ox[e].d !== 1);
    return '<div class="oxres"><div class="oxf">' + CE.fHTML(CE.normF(f)) + (+o.ch ? '<sup>' + (Math.abs(+o.ch) > 1 ? sF(Math.abs(+o.ch)) : '') + (+o.ch > 0 ? '+' : '−') + '</sup>' : '') + '</div>' + rows + '</div>' +
      '<p class="small muted" style="margin:8px 0 0">بررسی: مجموع عددهای اکسایش (هر عنصر × شمار اتم‌ها) باید برابر بار کل (' + (+o.ch ? oxF({ n: +o.ch, d: 1 }) : '۰') + ') باشد.' + (nonint ? ' عدد کسری یعنی میانگین عدد اکسایش در ترکیب (مثل Fe₃O₄).' : '') + '</p>';
  }
  function ecOx() {
    const o = S.cs.ech.ox;
    const ex = [['KMnO4', 0], ['K2Cr2O7', 0], ['H2O2', 0], ['NH4', 1], ['SO4', -2], ['HNO3', 0], ['NaH', 0], ['CH3OH', 0], ['Fe3O4', 0], ['ClO3', -1]];
    const rules = ['عنصر آزاد (مثل Cl₂ ، Fe ، O₂): ۰', 'یون تک‌اتمی: برابر بار یون (Fe³⁺ ← +۳)', 'مجموع عددهای اکسایش: در ترکیب خنثی ۰ ؛ در یون چنداتمی برابر بار یون', 'فلزهای گروه ۱: +۱ ؛ گروه ۲: +۲ ؛ Al: +۳', 'فلوئور همیشه −۱', 'هیدروژن: +۱ (در هیدریدهای فلزی مثل NaH ، −۱)', 'اکسیژن: −۲ (در پراکسیدها مثل H₂O₂ ، −۱ ؛ در OF₂ ، +۲)'];
    const bank = SE.REDOX_RXNS.map((r, i) => {
      const open = !!S.cs.ech.rev[i];
      return '<div class="rxcard"><div class="eqs">' + rxH(r.eq) + '</div>' + (open ? '<div class="rxans"><div><span class="role red">کاهنده</span> ' + spH(r.red) + ' <span class="small muted">(' + r.rc[0] + ')</span> ' + rowOx(r.rc[1], r.rc[2]) + ' <span class="small">اکسایش</span></div><div><span class="role ox">اکسنده</span> ' + spH(r.ox) + ' <span class="small muted">(' + r.oc[0] + ')</span> ' + rowOx(r.oc[1], r.oc[2]) + ' <span class="small">کاهش</span></div></div>' : '') + '<button class="btn" style="min-height:36px" data-act="ecrev" data-id="' + i + '">' + (open ? 'پنهان کردن پاسخ' : 'کاهنده و اکسنده کدام است؟') + '</button></div>';
    }).join('');
    return secCard('قاعده‌های عدد اکسایش', '<ol class="guide-list small">' + rules.map((x) => '<li>' + x + '</li>').join('') + '</ol>') +
      secCard('عدد اکسایش را حساب کن', '<div class="field"><label for="ec-f">فرمول</label><input class="inp" id="ec-f" dir="ltr" value="' + esc(o.f) + '" autocomplete="off" autocapitalize="off" spellcheck="false"></div><div class="field"><label for="ec-ch">بار کل (برای یون چنداتمی)</label><select class="sel" id="ec-ch">' + [-3, -2, -1, 0, 1, 2, 3].map((c) => '<option value="' + c + '"' + (+o.ch === c ? ' selected' : '') + '>' + (c === 0 ? 'ترکیب خنثی (۰)' : (c > 0 ? '+' : '−') + sF(Math.abs(c))) + '</option>').join('') + '</select></div><div class="row">' + ex.map((e) => '<button class="chip" data-act="ecoxex" data-id="' + e[0] + '" data-ch="' + e[1] + '"><span class="formula">' + CE.fmtF(e[0]) + '</span></button>').join('') + '</div><div id="ec-ox-out">' + ecOxOut() + '</div>') +
      secCard('عدد اکسایش برخی عنصرها', '<div class="table-wrap"><table class="atoms cmp"><tbody>' + SE.OXN_TABLE.map((r) => '<tr><td><span class="sym">' + r[0] + '</span></td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>').join('') + '</tbody></table></div>') +
      secCard('واکنش‌های اکسایش–کاهش', '<p class="small muted" style="margin:0 0 8px">کاهنده و اکسنده را پیدا کن، سپس پاسخ را ببین.</p><div class="rxlist">' + bank + '</div>');
  }

  /* ---------- E° table ---------- */
  function ecTable() {
    const e = S.cs.ech;
    const L = SE.COUPLES.slice().sort((a, b) => b.E - a.E).filter((c) => e.tf === 'all' || c.kind === 'H' || (e.tf === 'metal' ? c.kind === 'metal' : c.kind === 'other'));
    const rows = L.map((c) => {
      const sel = e.sel === c.id, w = Math.min(100, (Math.abs(c.E) / 3.1) * 100);
      const det = sel ? '<div class="erdet"><div><span class="role ox">اکسنده</span> ' + spH(c.ox) + '</div><div><span class="role red">کاهنده</span> ' + spH(c.red) + '</div><div class="small muted">شمار الکترون: ' + sF(c.n) + ' · ' + (c.E > 0 ? 'گرفتن الکترون آسان‌تر از H⁺ است' : c.E < 0 ? 'تمایل به کاهش کمتر از H⁺ است (شکل کاهیده کاهنده‌تر است)' : 'مرجع مقایسه') + '</div></div>' : '';
      return '<div class="erow' + (sel ? ' sel' : '') + (c.kind === 'H' ? ' ref' : '') + '"><button class="erh" data-act="ecsel" data-id="' + c.id + '" aria-expanded="' + sel + '"><span class="req">' + rxH(c.eq, '⇌') + '</span><b class="ev num ' + (c.E > 0 ? 'pos' : c.E < 0 ? 'neg' : '') + '">' + evF(c.E, true) + '</b><i class="ebar ' + (c.E >= 0 ? 'pos' : 'neg') + '" style="width:' + w + '%"></i></button>' + det + '</div>';
    }).join('');
    return '<div class="row">' + [['all', 'همه'], ['metal', 'فلزها'], ['other', 'غیرفلز و سایر']].map((c) => '<button class="chip" data-act="ectf" data-id="' + c[0] + '" aria-pressed="' + (e.tf === c[0]) + '">' + c[1] + '</button>').join('') + '</div>' +
      '<div class="msg info small"><b>اکسنده‌های قوی‌تر در بالا</b> و <b>کاهنده‌های قوی‌تر در پایین</b> جدول‌اند. روی هر سطر بزن تا جزئیات را ببینی. E° بر حسب ولت و در ۲۵°C است.</div>' +
      '<div class="etab"><div class="etop">↑ اکسنده‌ی قوی‌تر</div>' + rows + '<div class="ebot">↓ کاهنده‌ی قوی‌تر</div></div>' +
      '<div class="card flat small muted">مقدارها تقریبی و گردشده‌ی جدول‌های استاندارد کتاب درسی‌اند (نیم‌واکنش‌ها به صورت کاهشی).</div>';
  }

  /* ---------- galvanic cell ---------- */
  function netEq(c) {
    const side = (m, first) => {
      const keys = Object.keys(m).sort((a, b) => (first.indexOf(a) < 0 ? 9 : first.indexOf(a)) - (first.indexOf(b) < 0 ? 9 : first.indexOf(b)));
      return keys.map((s) => (m[s] > 1 ? m[s] : '') + s).join(' + ');
    };
    const ct = c.cath || c.ca;
    return side(c.react, [c.an.red, ct.ox]) + ' = ' + side(c.prod, [ct.red, c.an.ox]);
  }
  function halfEq(couple, dir) { // dir 'red' (reduction) or 'ox'
    const h = couple.half, tok = (m) => Object.keys(m).map((s) => (m[s] > 1 ? m[s] : '') + s).join(' + ');
    return dir === 'red' ? tok(h.left) + ' = ' + tok(h.right) : tok(h.right) + ' = ' + tok(h.left);
  }
  const electrodeOf = (c) => (c.kind === 'metal' ? c.red : 'Pt');
  function cellSVG(c) {
    const an = c.an, ca = c.cath, ea = electrodeOf(an), ec = electrodeOf(ca);
    const bub = (x, y) => '<circle class="bub" cx="' + x + '" cy="' + y + '" r="2.6"/>';
    const gasAn = an.kind === 'H' ? bub(52, 140) + bub(80, 125) : '', gasCa = ca.kind === 'H' ? bub(220, 140) + bub(246, 125) : '';
    const wire = (x1, x2) => '<path d="M' + x1 + ' 58 V32 H' + x2 + '" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/>';
    return '<svg viewBox="0 0 300 226" class="ecsvg" role="img" aria-label="سلول گالوانی"><defs><marker id="ea" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#E4572E"/></marker><marker id="ia" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--muted)"/></marker></defs>' +
      wire(66, 128) + wire(234, 172) +
      '<circle cx="150" cy="32" r="21" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.4"/><text x="150" y="29" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Vazirmatn,sans-serif">ولت‌سنج</text><text x="150" y="42" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)" font-family="Vazirmatn,sans-serif">' + evF(c.E) + ' V</text>' +
      '<path d="M82 32H112" stroke="#E4572E" stroke-width="2.2" marker-end="url(#ea)"/><path d="M188 32H218" stroke="#E4572E" stroke-width="2.2" marker-end="url(#ea)"/><text x="97" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#E4572E">e⁻</text><text x="203" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#E4572E">e⁻</text>' +
      '<path d="M40 104V178a8 8 0 0 0 8 8H106a8 8 0 0 0 8-8V104" fill="none" stroke="var(--ink)" stroke-width="2.4"/><path d="M42 116H112V178a6 6 0 0 1-6 6H48a6 6 0 0 1-6-6z" fill="#F4A582" opacity=".5"/>' +
      '<path d="M186 104V178a8 8 0 0 0 8 8H252a8 8 0 0 0 8-8V104" fill="none" stroke="var(--ink)" stroke-width="2.4"/><path d="M188 116H258V178a6 6 0 0 1-6 6H194a6 6 0 0 1-6-6z" fill="#7FB0F0" opacity=".5"/>' +
      '<rect x="60" y="58" width="12" height="104" rx="2" fill="#8E98AD" stroke="var(--ink)" stroke-width="1.4"/><rect x="228" y="58" width="12" height="104" rx="2" fill="#8E98AD" stroke="var(--ink)" stroke-width="1.4"/>' + gasAn + gasCa +
      '<path d="M96 110V84H204V110" fill="none" stroke="var(--line)" stroke-width="12" stroke-linejoin="round"/><path d="M96 110V84H204V110" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-linejoin="round" opacity=".7"/><text x="150" y="78" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="Vazirmatn,sans-serif">پل نمکی</text>' +
      '<path d="M146 96H112" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ia)"/><path d="M154 96H188" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ia)"/><text x="130" y="92" text-anchor="middle" font-size="9" fill="var(--muted)">−</text><text x="172" y="92" text-anchor="middle" font-size="9" fill="var(--muted)">+</text>' +
      '<text x="90" y="150" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">' + spPlain(ea) + '</text><text x="210" y="150" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">' + spPlain(ec) + '</text>' +
      '<text x="77" y="166" text-anchor="middle" font-size="10" fill="var(--ink)" opacity=".85">' + spPlain(an.ox) + '</text><text x="223" y="166" text-anchor="middle" font-size="10" fill="var(--ink)" opacity=".85">' + spPlain(ca.ox) + '</text>' +
      '<text x="77" y="205" text-anchor="middle" font-size="12" font-weight="800" fill="#C2410C" font-family="Vazirmatn,sans-serif">آند (−)</text><text x="223" y="205" text-anchor="middle" font-size="12" font-weight="800" fill="#1D4ED8" font-family="Vazirmatn,sans-serif">کاتد (+)</text>' +
      '<text x="77" y="219" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="Vazirmatn,sans-serif">اکسایش</text><text x="223" y="219" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="Vazirmatn,sans-serif">کاهش</text></svg>';
  }
  const coupleSel = (id, cur) => '<select class="sel" id="' + id + '">' + SE.COUPLES.slice().sort((a, b) => a.E - b.E).map((c) => '<option value="' + c.id + '"' + (c.id === cur ? ' selected' : '') + '>' + coupleLbl(c) + '  (' + evF(c.E, true) + ')</option>').join('') + '</select>';
  function ecCellOut() {
    const e = S.cs.ech;
    if (e.cA === e.cB) return '<div class="msg err" role="status">دو نیم‌سلول متفاوت انتخاب کن.</div>';
    const c = SE.cell(e.cA, e.cB), an = c.an, ca = c.cath;
